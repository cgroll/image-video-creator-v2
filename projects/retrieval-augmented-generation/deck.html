<title>Retrieval Augmented Generation — Video Deck</title>
<style>
  :root{
    color-scheme: light;
    --bg: #f6f7f9;
    --grid: #dfe1e8;
    --fg: #1d1f2b;
    --fg-dim: #5c5f72;
    --accent: #5b3fae;       /* deep violet — primary */
    --accent-warm: #cf5d3f;  /* clay orange — emphasis */
    --mono: "SF Mono", "Cascadia Code", Menlo, Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; overflow:hidden; background:var(--bg); }

  .stage{
    width:1920px; height:1080px; position:relative;
    background:var(--bg); overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--sans); color:var(--fg);
  }

  /* ---- manual-preview mode: the stage is a fixed 1920x1080 recording
     canvas, so scale-to-fit + center it in whatever window the browser
     actually has — otherwise any non-16:9 or smaller window silently clips
     the bottom/right of the canvas (hiding captions/citations) instead of
     showing the whole slide shrunk down. ---- */
  body.manual-mode .stage{
    position:fixed; top:50%; left:50%; transform-origin:center center;
  }

  .eyebrow{
    position:absolute; top:64px; left:0; right:0; text-align:center;
    font-size:24px; letter-spacing:.18em; color:var(--fg-dim); text-transform:uppercase;
    font-family:var(--mono);
    transition: opacity .3s ease;
  }

  .glow{
    position:absolute; width:1000px; height:1000px; border-radius:50%;
    filter:blur(140px); opacity:.14; pointer-events:none;
    background:var(--accent); transition: background .5s ease;
  }

  #content{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:34px;
    opacity:0; transform:translateY(10px);
    transition:opacity .45s ease, transform .45s ease;
  }
  #content.show{ opacity:1; transform:translateY(0); }

  .kicker{
    font-size:26px; letter-spacing:.16em; color:var(--fg-dim); text-transform:uppercase;
    font-family:var(--mono); font-weight:600;
  }

  .statement{ font-size:66px; font-weight:700; text-align:center; line-height:1.32; max-width:1500px; }
  .word-hl{ color:var(--accent-warm); }

  .cta-domain{
    font-size:57px; font-weight:700; border-bottom:5px solid var(--accent); padding-bottom:16px;
    font-family:var(--mono);
  }

  /* ---- image slide: an embedded reference chart, with citation ---- */
  .image-slide{ display:flex; flex-direction:column; align-items:center; gap:20px; }
  .image-slide img{
    max-width:1560px; max-height:680px; border-radius:14px; border:1px solid var(--grid);
    box-shadow:0 18px 50px rgba(20,26,46,.1); background:#fff;
  }
  .image-slide .citation{
    font-family:var(--mono); font-size:17px; color:var(--fg-dim); text-align:center; max-width:1400px;
  }

  /* ---- stat: one big number + label, for a headline result ---- */
  .stat-slide{ display:flex; flex-direction:column; align-items:center; gap:22px; }
  .stat-number{ font-size:180px; font-weight:800; line-height:1; color:var(--accent-warm); font-family:var(--mono); }
  .stat-label{ font-size:44px; font-weight:700; text-align:center; max-width:1300px; line-height:1.3; }
  .stat-sub{ font-family:var(--mono); font-size:22px; color:var(--fg-dim); text-align:center; max-width:1300px; }

  /* ---- context-window fill experiment (chapter 2): a dashed "context
     window" box holding a few document chips, a muted row of chips that
     didn't make it in, and a smiley outcome panel underneath. ---- */
  .ctxfill-case{
    font-family:var(--mono); font-size:22px; color:var(--fg-dim); text-align:center; max-width:1400px;
  }
  .ctxfill-stage{ display:flex; flex-direction:column; align-items:center; gap:30px; }
  .ctxfill-window{
    position:relative; min-width:960px; min-height:150px; padding:50px 44px 30px;
    border:3px dashed var(--accent); border-radius:22px; background:rgba(91,63,174,.06);
    display:flex; flex-wrap:wrap; gap:20px; justify-content:center; align-items:center;
  }
  .ctxfill-window.bad{ border-color:#c0392b; background:rgba(192,57,43,.06); }
  .ctxfill-window-label{
    position:absolute; top:-19px; left:50%; transform:translateX(-50%);
    background:var(--bg); padding:2px 20px; font-family:var(--mono); font-size:19px;
    letter-spacing:.14em; color:var(--fg-dim);
  }
  .ctxfill-chip{
    display:flex; align-items:center; gap:12px; padding:18px 26px; border-radius:14px;
    font-family:var(--mono); font-size:22px; font-weight:600; background:#fff;
    border:2px solid var(--grid); box-shadow:0 6px 18px rgba(0,0,0,.07); color:var(--fg);
  }
  .ctxfill-chip.truth{ border-color:#2e9e5b; background:#eafaf0; color:#1f6b3d; }
  .ctxfill-chip.noise{ border-color:#d6a93a; background:#fdf6e3; color:#8a6c1a; }
  .ctxfill-chip.wrong{ border-color:#c0392b; background:#fdecea; color:#922418; }
  .ctxfill-outside-wrap{ display:flex; flex-direction:column; align-items:center; gap:10px; }
  .ctxfill-outside-label{
    font-family:var(--mono); font-size:16px; letter-spacing:.14em; color:var(--fg-dim);
  }
  .ctxfill-outside{ display:flex; gap:16px; flex-wrap:wrap; justify-content:center; max-width:1500px; }
  .ctxfill-chip.excluded{
    opacity:.4; border-style:dashed; filter:grayscale(1); font-size:19px; padding:13px 20px;
  }
  .ctxfill-outcome{
    display:flex; align-items:center; gap:24px; padding:20px 40px; border-radius:18px;
    border:2px solid var(--grid); background:#fff; box-shadow:0 10px 26px rgba(0,0,0,.09);
  }
  .ctxfill-outcome.good{ border-color:#2e9e5b; background:#eafaf0; }
  .ctxfill-outcome.mid{ border-color:#d6a93a; background:#fdf6e3; }
  .ctxfill-outcome.bad{ border-color:#c0392b; background:#fdecea; }
  .ctxfill-face{ font-size:68px; line-height:1; }
  .ctxfill-outcome-label{ font-size:32px; font-weight:700; }

  /* ---- agentic search (chapter 4): an orchestrating agent that calls
     three tools -- every call, including the first, visibly originates
     from the agent via an arrow. Keyword search gets called repeatedly
     with a different term each time (shown as a "call N of 4" badge + the
     literal term), which is what the earlier "iterate" tool used to stand
     in for -- now it's just the same tool, called again. A corpus
     mini-grid shows what each call actually touches, and a cost meter
     tracks the (non-monotonic!) token cost per call. The final embeddings
     step uses the same "touched" styling as every other tool -- no special
     "guaranteed correct" treatment -- because it's a tool returning
     candidates quickly, not an oracle. ---- */
  .agsearch-stage{ display:flex; flex-direction:column; align-items:center; gap:22px; }
  .agsearch-box{ position:relative; width:1500px; height:560px; }
  .agsearch-lines{ position:absolute; inset:0; pointer-events:none; }
  .agsearch-agent{
    position:absolute; transform:translate(-50%,-50%); display:flex; flex-direction:column;
    align-items:center; gap:6px;
  }
  .agsearch-agent .icon{ font-size:44px; }
  .agsearch-agent .label{ font-family:var(--mono); font-size:16px; font-weight:700; color:var(--fg); }
  .agsearch-tool{
    position:absolute; transform:translate(-50%,-50%); display:flex; flex-direction:column;
    align-items:center; gap:8px; padding:16px 18px; border-radius:16px; border:2px solid var(--grid);
    background:#fff; min-width:160px; transition:all .3s ease;
  }
  .agsearch-tool-icon{ font-size:38px; }
  .agsearch-tool-label{
    font-family:var(--mono); font-size:15px; font-weight:600; text-align:center;
    max-width:160px; line-height:1.25; color:var(--fg-dim);
  }
  .agsearch-tool.pending{ opacity:.4; filter:grayscale(1); }
  .agsearch-tool.done{ border-color:#2e9e5b; background:#eafaf0; }
  .agsearch-tool.done .agsearch-tool-label{ color:#1f6b3d; }
  .agsearch-tool.active{
    border-color:var(--accent); background:rgba(91,63,174,.08); transform:translate(-50%,-50%) scale(1.08);
    box-shadow:0 10px 26px rgba(91,63,174,.18);
  }
  .agsearch-tool.active .agsearch-tool-label{ color:var(--accent); }
  .agsearch-term-badge{
    position:absolute; transform:translate(-50%,-50%); display:flex; align-items:center; gap:10px;
    padding:8px 18px; border-radius:999px; border:2px solid #d6a93a; background:#fdf6e3;
    font-family:var(--mono); font-size:16px; color:#8a6c1a; white-space:nowrap;
  }
  .agsearch-term-badge b{ color:#1d1f2b; }
  .agsearch-corpus-wrap{ position:absolute; display:flex; flex-direction:column; align-items:center; gap:10px; }
  .agsearch-corpus-label{ font-family:var(--mono); font-size:16px; letter-spacing:.14em; color:var(--fg-dim); }
  .agsearch-corpus-grid{ display:grid; grid-template-columns:repeat(4, 48px); grid-template-rows:repeat(4, 48px); gap:8px; }
  .agsearch-cell{
    display:flex; align-items:center; justify-content:center; border-radius:9px;
    font-size:20px; border:2px solid var(--grid); background:#fff; transition:all .3s ease;
  }
  .agsearch-cell.idle{ opacity:.25; filter:grayscale(1); }
  .agsearch-cell.touched{ border-color:#d6a93a; background:#fdf6e3; }
  .agsearch-meter-wrap{ display:flex; flex-direction:column; align-items:center; gap:8px; width:640px; }
  .agsearch-meter-label{ font-family:var(--mono); font-size:19px; color:var(--fg-dim); }
  .agsearch-meter-track{ width:100%; height:22px; border-radius:11px; background:var(--grid); overflow:hidden; }
  .agsearch-meter-fill{ height:100%; border-radius:11px; transition:width .4s ease; }
  .agsearch-meter-fill.good{ background:#2e9e5b; }
  .agsearch-meter-fill.mid{ background:#d6a93a; }
  .agsearch-meter-fill.bad{ background:#cf5d3f; }

  /* ---- embedding space (chapter 4): a stylized 2D "meaning space" scatter
     -- topic clusters of chunks, then a query point with dashed lines to
     its nearest (= most relevant) neighbours. ---- */
  .embed-space-wrap{ display:flex; flex-direction:column; align-items:center; gap:18px; }
  .embed-space-box{
    width:900px; height:560px; border-radius:22px; border:3px dashed var(--grid);
    background:rgba(91,63,174,.03); position:relative;
  }
  .embed-space-box-label{
    position:absolute; top:-19px; left:50%; transform:translateX(-50%);
    background:var(--bg); padding:2px 20px; font-family:var(--mono); font-size:19px;
    letter-spacing:.14em; color:var(--fg-dim);
  }
  .embed-legend{ display:flex; gap:34px; font-family:var(--mono); font-size:18px; color:var(--fg-dim); }
  .embed-legend .dot{ display:inline-block; width:14px; height:14px; border-radius:50%; margin-right:8px; vertical-align:middle; }

  /* ---- embedding fan-out (chapter 5): one document branching into several
     embeddings, then forking into "average" vs "keep separate" -- shown as
     an explicitly open question (dashed lines, amber "?" hub). ---- */
  .fanout-box{ position:relative; width:1500px; height:560px; }
  .fanout-lines{ position:absolute; inset:0; pointer-events:none; }
  .fanout-node{
    position:absolute; transform:translate(-50%,-50%); display:flex; flex-direction:column;
    align-items:center; gap:8px; padding:18px 22px; border-radius:16px; border:2px solid var(--grid);
    background:#fff; box-shadow:0 10px 26px rgba(0,0,0,.08); text-align:center;
  }
  .fanout-node .icon{ font-size:36px; }
  .fanout-node .label{ font-family:var(--mono); font-size:17px; font-weight:600; color:var(--fg); max-width:210px; line-height:1.3; }
  .fanout-node.doc{ border-color:var(--accent); background:rgba(91,63,174,.06); }
  .fanout-node.question{
    border-radius:50%; width:72px; height:72px; padding:0; justify-content:center;
    border-color:#d6a93a; background:#fdf6e3; font-size:32px; font-weight:800; color:#8a6c1a;
  }
  .fanout-node.strategy{ border-style:dashed; border-color:#d6a93a; }

  /* ---- ingestion overview (chapter 5): the chapter's opening map -- one
     document branching into four standard preprocessing steps (OCR/text,
     tags+summary, metadata, embeddings), all funneling into one "index"
     node -- the concrete, automatable version of the "back of a book"
     analogy from the scene right before this one. Reuses .fanout-node for
     the pill styling. ---- */
  .ingov-box{ position:relative; width:1500px; height:620px; }
  .ingov-lines{ position:absolute; inset:0; pointer-events:none; }
  .fanout-node.index{
    border-color:#2e9e5b; background:#eafaf0; width:220px;
  }

  /* ---- boilerplate trap (chapter 5): a shared boilerplate section across
     unrelated documents falsely "matching" an unrelated query. ---- */
  .boiler-box{ position:relative; width:1500px; height:560px; }
  .boiler-lines{ position:absolute; inset:0; pointer-events:none; }
  .boiler-query{
    position:absolute; transform:translate(-50%,-50%); display:flex; flex-direction:column;
    align-items:center; gap:8px;
  }
  .boiler-query .icon{ font-size:40px; }
  .boiler-query .label{ font-family:var(--mono); font-size:16px; font-weight:600; color:var(--fg-dim); max-width:300px; text-align:center; }
  .boiler-doc{
    position:absolute; transform:translate(-50%,-50%); width:340px; border-radius:18px; overflow:hidden;
    border:2px solid var(--grid); background:#fff; box-shadow:0 10px 26px rgba(0,0,0,.08);
  }
  .boiler-doc .unique{ padding:24px; font-family:var(--mono); font-size:18px; font-weight:700; text-align:center; }
  .boiler-doc .boilerplate{
    padding:18px; font-family:var(--mono); font-size:15px; text-align:center; color:#8a6c1a;
    background:repeating-linear-gradient(45deg, #fdf6e3, #fdf6e3 10px, #f7ecc9 10px, #f7ecc9 20px);
    border-top:2px dashed #d6a93a;
  }
  .boiler-caption{ font-family:var(--mono); font-size:20px; color:#922418; font-weight:700; text-align:center; }

  /* ---- chat citations (chapter 6, the UI aspect): a chat answer with
     numbered inline citation badges, next to the source excerpt cards they
     point to -- the shared number IS the connection, no lines needed. ---- */
  .citui-wrap{ display:flex; gap:40px; align-items:flex-start; width:1700px; }
  .citui-chat{ flex:1.3; display:flex; flex-direction:column; gap:20px; }
  .citui-bubble{ padding:22px 26px; border-radius:18px; font-family:var(--sans); font-size:23px; line-height:1.45; }
  .citui-bubble.user{ background:var(--accent); color:#fff; align-self:flex-end; max-width:78%; }
  .citui-bubble.assistant{ background:#fff; border:2px solid var(--grid); color:var(--fg); box-shadow:0 10px 26px rgba(0,0,0,.06); }
  .citui-cite{
    display:inline-flex; align-items:center; justify-content:center; width:30px; height:30px;
    border-radius:50%; background:var(--accent); color:#fff; font-family:var(--mono); font-size:15px;
    font-weight:700; margin:0 3px; vertical-align:middle; position:relative; top:-2px;
  }
  .citui-sources{ flex:1; display:flex; flex-direction:column; gap:16px; padding-top:4px; }
  .citui-source-label{ font-family:var(--mono); font-size:16px; letter-spacing:.14em; color:var(--fg-dim); }
  .citui-card{ display:flex; gap:14px; padding:18px 20px; border-radius:14px; border:2px solid var(--grid); background:#fff; box-shadow:0 8px 20px rgba(0,0,0,.05); }
  .citui-card .num{
    width:30px; height:30px; border-radius:50%; background:var(--accent); color:#fff; flex:none;
    display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-weight:700;
  }
  .citui-card .file{ font-family:var(--mono); font-size:14px; color:var(--fg-dim); margin-bottom:6px; }
  .citui-card .snippet{ font-family:var(--sans); font-size:17px; color:var(--fg); font-style:italic; line-height:1.35; }
  .citui-card .snippet mark{ background:#fdf6e3; color:#8a6c1a; padding:0 2px; border-radius:3px; font-style:normal; }

  /* ---- eval question-gen table (new evaluation chapter): one generated
     question per section, and whether retrieval actually surfaces that
     section again. ---- */
  .eqtable{ display:flex; flex-direction:column; gap:14px; width:1650px; }
  .eqtable-head, .eqtable-row{ display:grid; grid-template-columns: 230px 1fr 170px; gap:18px; align-items:center; }
  .eqtable-head .cell{ font-family:var(--mono); font-size:16px; color:var(--fg-dim); letter-spacing:.03em; }
  .eqtable-row{ padding:14px 20px; border-radius:14px; border:2px solid var(--grid); background:#fff; }
  .eqtable-row .section{ font-family:var(--mono); font-weight:700; font-size:17px; color:var(--accent); }
  .eqtable-row .question{ font-family:var(--sans); font-size:19px; color:var(--fg); }
  .eqtable-verdict{
    display:flex; align-items:center; justify-content:center; gap:10px; height:48px; border-radius:12px;
    font-family:var(--mono); font-size:16px; font-weight:700;
  }
  .eqtable-verdict.yes{ border:2px solid #2e9e5b; background:#eafaf0; color:#1f6b3d; }
  .eqtable-verdict.no{ border:2px solid #c0392b; background:#fdecea; color:#922418; }
  .eqtable-footer{ font-family:var(--mono); font-size:20px; color:var(--fg-dim); text-align:center; margin-top:4px; }
  .eqtable-footer b{ color:var(--fg); }

  /* ---- LLM as judge (new evaluation chapter): question + candidate
     answer + source document converge on a judge model, which scores a
     few concrete criteria. ---- */
  .judge-box{ position:relative; width:1500px; height:600px; }
  .judge-lines{ position:absolute; inset:0; pointer-events:none; }
  .judge-verdict{
    position:absolute; transform:translate(-50%,-50%); width:280px; padding:20px 24px; border-radius:16px;
    border:2px solid #2e9e5b; background:#eafaf0; display:flex; flex-direction:column; gap:10px;
  }
  .judge-verdict .row{ display:flex; align-items:center; justify-content:space-between; font-family:var(--mono); font-size:16px; color:#1f6b3d; font-weight:600; }

  /* ---- evaluation matrix (chapter 8): three build stages x what's
     measurable, rows revealed/highlighted step by step. ---- */
  .evalmatrix{ display:flex; flex-direction:column; gap:14px; width:1650px; }
  .evalmatrix-head, .evalmatrix-row{ display:grid; grid-template-columns: 440px repeat(3, 1fr); gap:14px; align-items:center; }
  .evalmatrix-head .cell{ font-family:var(--mono); font-size:16px; color:var(--fg-dim); text-align:center; letter-spacing:.03em; line-height:1.3; }
  .evalmatrix-row{ transition:opacity .4s ease; }
  .evalmatrix-row .stage-label{
    font-family:var(--mono); font-size:19px; font-weight:700; padding:16px 20px; border-radius:14px;
    border:2px solid var(--grid); background:#fff; transition:all .3s ease;
  }
  .evalmatrix-row.active .stage-label{ border-color:var(--accent); background:rgba(91,63,174,.08); color:var(--accent); }
  .evalmatrix-row.done .stage-label{ border-color:#2e9e5b; background:#eafaf0; color:#1f6b3d; }
  .evalmatrix-row.dim{ opacity:.55; }
  .evalmatrix-row.pending{ opacity:.14; }
  .evalmatrix-cell{
    display:flex; align-items:center; justify-content:center; height:62px; border-radius:14px;
    border:2px solid var(--grid); background:#fff; font-size:28px;
  }
  .evalmatrix-cell.yes{ border-color:#2e9e5b; background:#eafaf0; color:#1f6b3d; }
  .evalmatrix-cell.no{ border-color:#c0392b; background:#fdecea; color:#922418; }

  /* ---- checklist (cumulative step reveal) ---- */
  .checklist{ display:flex; flex-direction:column; gap:34px; max-width:1650px; }
  .checklist .item{
    display:flex; align-items:center; gap:26px; font-size:40px; font-weight:700;
    opacity:0; transform:translateX(-16px); transition:opacity .5s ease, transform .5s ease;
  }
  .checklist .item.active{ opacity:1; transform:translateX(0); }
  .checklist .item .num{
    width:52px; height:52px; border-radius:14px; background:var(--accent); color:#fff; flex:none;
    display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-size:26px;
    box-shadow:0 8px 20px rgba(26,82,118,.28);
  }

  /* ---- manual browsing controls: shown by default, hidden only for the recorder (?record=1) ---- */
  .manual-nav{
    display:none; position:fixed; left:0; right:0; bottom:26px;
    flex-direction:column; align-items:center; gap:12px; z-index:50; font-family:var(--mono);
  }
  body.manual-mode .manual-nav{ display:flex; }
  .manual-nav .row{ display:flex; align-items:center; gap:16px; }
  .manual-nav .nav-btn{
    font-family:var(--mono); font-size:20px; line-height:1;
    background:#fff; color:var(--fg); border:1px solid var(--grid);
    border-radius:8px; width:40px; height:40px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 14px rgba(0,0,0,.08);
  }
  .manual-nav .nav-btn:hover{ border-color:var(--accent); color:var(--accent); }
  .manual-nav .counter{
    font-size:13px; color:var(--fg-dim); min-width:70px; text-align:center;
    background:#fff; border-radius:8px; padding:8px 12px; box-shadow:0 4px 14px rgba(0,0,0,.08);
  }
  .manual-nav .dots{ display:flex; gap:5px; flex-wrap:wrap; max-width:900px; justify-content:center; }
  .manual-nav .dot{ width:8px; height:8px; border-radius:50%; background:var(--grid); border:none; cursor:pointer; padding:0; }
  .manual-nav .dot.on{ background:var(--accent); }

  /* ---- speaker-text panel: manual-mode only, never shown in recording ---- */
  .speaker-panel{
    display:none; position:fixed; right:0; top:0; bottom:0; width:340px;
    background:rgba(255,255,255,.97); border-left:1px solid var(--grid);
    box-shadow:-8px 0 24px rgba(0,0,0,.06); z-index:60;
    padding:28px 24px; box-sizing:border-box; overflow-y:auto;
    font-family:var(--mono);
  }
  body.manual-mode .speaker-panel{ display:block; }
  body.manual-mode.hide-speaker-text .speaker-panel{ display:none; }
  .speaker-panel .label{
    font-size:12px; letter-spacing:.08em; color:var(--fg-dim); margin-bottom:14px;
  }
  .speaker-panel .body{ font-size:17px; line-height:1.55; color:var(--fg); white-space:pre-wrap; }
</style>

<div class="stage">
  <p class="eyebrow" id="eyebrow">RETRIEVAL AUGMENTED GENERATION</p>
  <div class="glow" id="glow"></div>

  <div id="content"></div>

  <div class="manual-nav" id="manual-nav">
    <div class="dots" id="manual-dots"></div>
    <div class="row">
      <button class="nav-btn" id="manual-prev" aria-label="Previous scene">‹</button>
      <div class="counter" id="manual-counter">1 / 1</div>
      <button class="nav-btn" id="manual-next" aria-label="Next scene">›</button>
      <button class="nav-btn" id="manual-toggle-text" aria-label="Toggle speaker text" title="Toggle speaker text (T)">T</button>
    </div>
  </div>

  <div class="speaker-panel" id="speaker-panel">
    <div class="label">SPEAKER TEXT</div>
    <div class="body" id="speaker-panel-body"></div>
  </div>
</div>

<script src="deck-scenes.js"></script>
<script>
  // ---------- content-driven text slides ----------
  // Small, project-specific style library: statement / cta / image / stat /
  // checklist. Plus one custom diagram so far (context_fill_step, below) --
  // see its own block for the context-window-fill experiment visualization.
  const RENDERERS = {
    "statement": (s) => `
      ${s.kicker ? `<div class="kicker">${s.kicker}</div>` : ""}
      <div class="statement">${s.lines.join("<br>")}</div>
    `,
    "cta": (s) => `
      <div class="kicker">${s.kicker || "MORE ON THIS"}</div>
      <div class="cta-domain">${s.content}</div>
    `,
    "image": (s) => `
      ${s.kicker ? `<div class="kicker">${s.kicker}</div>` : ""}
      <div class="image-slide">
        <img src="${s.src}" alt="${s.alt || ""}">
        ${s.citation ? `<div class="citation">${s.citation}</div>` : ""}
      </div>
    `,
    "stat": (s) => `
      ${s.kicker ? `<div class="kicker">${s.kicker}</div>` : ""}
      <div class="stat-slide">
        <div class="stat-number">${s.number}</div>
        <div class="stat-label">${s.label || ""}</div>
        ${s.sub ? `<div class="stat-sub">${s.sub}</div>` : ""}
      </div>
    `,
    "checklist": (s) => `
      ${s.kicker ? `<div class="kicker">${s.kicker}</div>` : ""}
      <div class="checklist" id="checklist-items">
        ${s.items.map((it, i) => {
          const active = i < (s.revealCount ?? s.items.length);
          return `<div class="item ${active ? 'active' : ''}"><div class="num">${i + 1}</div>${it}</div>`;
        }).join("")}
      </div>
    `,
  };

  const GLOW_COLOR = {
    "statement": "#5b3fae", "cta": "#5b3fae", "image": "#5b3fae",
    "stat": "#cf5d3f", "checklist": "#5b3fae",
  };

  const contentEl = document.getElementById("content");
  const eyebrowEl = document.getElementById("eyebrow");
  const glowEl = document.getElementById("glow");

  let checklistKey = null;

  function hideAllViews() {
    contentEl.classList.remove("show");
    checklistKey = null;
  }

  // ---------- context-window fill experiment (chapter 2) ----------
  // Three fixed snapshots, not an animated progression -- each step is its
  // own self-contained picture (perfect / plus noise / wrong), so we just
  // rebuild the whole thing per step rather than tweening between them.
  const CTXFILL_CASE = 'Hard case: a switchgear diagram — "which breaker feeds Panel 3?"';
  const CTXFILL_TRUTH = "Panel 3 relay page";
  const CTXFILL_OTHERS = ["Panel 1 page", "Site photo index", "Permit cover letter"];

  function ctxfillChip(label, cls) {
    return `<div class="ctxfill-chip ${cls}">📄 <span>${label}</span></div>`;
  }

  function buildCtxFill(kicker, n) {
    let windowChips, outsideChips, windowClass = "", outcomeClass, face, outcomeLabel;
    if (n === 1) {
      windowChips = ctxfillChip(CTXFILL_TRUTH, "truth");
      outsideChips = CTXFILL_OTHERS.map((l) => ctxfillChip(l, "excluded")).join("");
      outcomeClass = "good"; face = "🙂"; outcomeLabel = "Right answer";
    } else if (n === 2) {
      windowChips = [ctxfillChip(CTXFILL_TRUTH, "truth"), ctxfillChip(CTXFILL_OTHERS[0], "noise"), ctxfillChip(CTXFILL_OTHERS[1], "noise")].join("");
      outsideChips = ctxfillChip(CTXFILL_OTHERS[2], "excluded");
      outcomeClass = "mid"; face = "😐"; outcomeLabel = "Quality can slip";
    } else {
      windowChips = [CTXFILL_OTHERS[0], CTXFILL_OTHERS[1]].map((l) => ctxfillChip(l, "wrong")).join("");
      outsideChips = ctxfillChip(CTXFILL_TRUTH + " — left out", "excluded") + ctxfillChip(CTXFILL_OTHERS[2], "excluded");
      windowClass = "bad"; outcomeClass = "bad"; face = "🙁"; outcomeLabel = "Wrong answer";
    }
    return `
      ${kicker ? `<div class="kicker">${kicker}</div>` : ""}
      <div class="ctxfill-case">${CTXFILL_CASE}</div>
      <div class="ctxfill-stage">
        <div class="ctxfill-window ${windowClass}">
          <div class="ctxfill-window-label">CONTEXT WINDOW</div>
          ${windowChips}
        </div>
        <div class="ctxfill-outside-wrap">
          <div class="ctxfill-outside-label">NOT FED IN</div>
          <div class="ctxfill-outside">${outsideChips}</div>
        </div>
        <div class="ctxfill-outcome ${outcomeClass}">
          <div class="ctxfill-face">${face}</div>
          <div class="ctxfill-outcome-label">${outcomeLabel}</div>
        </div>
      </div>
    `;
  }

  window.setCtxFillStep = function (kicker, n) {
    hideAllViews();
    eyebrowEl.style.opacity = 1;
    glowEl.style.background = n === 3 ? "#c0392b" : (n === 2 ? "#d6a93a" : "#2e9e5b");
    contentEl.innerHTML = buildCtxFill(kicker, n);
    void contentEl.offsetWidth;
    contentEl.classList.add("show");
  };

  function showSlide(scene) {
    hideAllViews();
    eyebrowEl.style.opacity = 1;
    glowEl.style.background = GLOW_COLOR[scene.style] || "#1a5276";
    contentEl.innerHTML = RENDERERS[scene.style](scene);
    void contentEl.offsetWidth; // force reflow so opacity:0 commits before re-adding "show"
    contentEl.classList.add("show");
  }

  window.goToSlide = function (styleAndData) { showSlide(styleAndData); };

  window.setChecklistStep = function (kicker, items, n) {
    const key = kicker + "|" + JSON.stringify(items);
    if (key !== checklistKey) {
      hideAllViews();
      eyebrowEl.style.opacity = 1;
      glowEl.style.background = GLOW_COLOR["checklist"];
      const hlItems = items.map((it) => applyHighlights(it));
      contentEl.innerHTML = RENDERERS["checklist"]({ kicker, items: hlItems, revealCount: n });
      void contentEl.offsetWidth;
      contentEl.classList.add("show");
      checklistKey = key;
    } else {
      document.querySelectorAll("#checklist-items .item").forEach((el, i) => {
        el.classList.toggle("active", i < n);
      });
    }
  };

  // Inline word-highlight markup: `[[word]]` in a scene's content/items text
  // becomes a styled <span>, e.g. "you can just [[call]]." -- lets a single
  // sentence flag which word to emphasize without a separate per-word field.
  function applyHighlights(text) {
    return text.replace(/\[\[(.+?)\]\]/g, '<span class="word-hl">$1</span>');
  }

  // ---------- agentic search (chapter 4) ----------
  // Six fixed snapshots of ONE agent (explicitly drawn, with an arrow to
  // whichever tool it's calling -- including the very first call) working
  // through three tools: read-everything -> keyword search, called
  // repeatedly with a different literal term each time ("call N of 4",
  // shown with the actual term -- this is what "iterate" means: not a
  // separate fourth tool, just the same keyword tool invoked again) ->
  // embeddings. The target chunk (index 5) is deliberately ABSENT from the
  // touched set in the early keyword calls (literal terms can miss it) and
  // only enters once the agent broadens its term, so the story is "search,
  // look, still missing it, broaden, found it" rather than a monotonic
  // narrowing funnel. The final embeddings step reuses the exact same
  // "touched" cell styling as every other tool -- deliberately NOT a
  // special "guaranteed correct" green reveal -- because embeddings is
  // just another tool returning candidates quickly (and often the only
  // option at all for images), not an oracle.
  const AGSEARCH_AGENT = { x: 750, y: 40 };
  const AGSEARCH_TOOLS = [
    { icon: "📚", label: "Read everything", x: 260, y: 150 },
    { icon: "🔤", label: "Keyword search", x: 750, y: 150 },
    { icon: "🧭", label: "Embedding search", x: 1240, y: 150 },
  ];
  const AGSEARCH_TOOL_FOR_STEP = [0, 1, 1, 1, 1, 2]; // active tool index, by step n (1..6)
  const AGSEARCH_TERM = [null, "breaker", "CB", "circuit breaker", "circuit breaker panel 3", null];
  const AGSEARCH_CALL = [null, 1, 2, 3, 4, null]; // "call N of 4", keyword-search calls only
  const AGSEARCH_TOUCHED = [
    Array.from({ length: 16 }, (_, i) => i),
    [1, 8, 12],
    [1, 3, 8],
    [1, 3, 5, 8, 12],
    [1, 3, 5, 8, 12],
    [5, 9],
  ];
  const AGSEARCH_COST = [10, 2, 4, 6, 9, 1]; // relative units, 1-10, deliberately non-monotonic
  const AGSEARCH_COST_LABEL = [
    "agent reads every document itself",
    "call 1 of 4 — exact match, cheap, but can miss",
    "call 2 of 4 — different term, still missing it",
    "call 3 of 4 — broader synonym, catches it",
    "call 4 of 4 — confirming, cost still climbing",
    "a separate tool call — fast, good for images too",
  ];

  function buildAgenticSearch(kicker, n) {
    const activeTool = AGSEARCH_TOOL_FOR_STEP[n - 1];
    const touched = new Set(AGSEARCH_TOUCHED[n - 1]);
    const cost = AGSEARCH_COST[n - 1];
    const costLabel = AGSEARCH_COST_LABEL[n - 1];
    const costPct = Math.round((cost / 10) * 100);
    const costClass = cost <= 3 ? "good" : cost <= 6 ? "mid" : "bad";
    const term = AGSEARCH_TERM[n - 1];
    const call = AGSEARCH_CALL[n - 1];

    const linesHtml = AGSEARCH_TOOLS.map((t, i) => {
      const active = i === activeTool;
      return `<line x1="${AGSEARCH_AGENT.x}" y1="${AGSEARCH_AGENT.y + 28}" x2="${t.x}" y2="${t.y - 58}" stroke="${active ? "#5b3fae" : "#d8d2ef"}" stroke-width="${active ? 3.5 : 2}" ${active ? "" : 'stroke-dasharray="6,6"'}/>`;
    }).join("");

    const toolsHtml = AGSEARCH_TOOLS.map((t, i) => {
      const state = i < activeTool ? "done" : i === activeTool ? "active" : "pending";
      return `<div class="agsearch-tool ${state}" style="left:${t.x}px; top:${t.y}px;"><div class="agsearch-tool-icon">${t.icon}</div><div class="agsearch-tool-label">${t.label}</div></div>`;
    }).join("");

    const termHtml = term
      ? `<div class="agsearch-term-badge" style="left:${AGSEARCH_AGENT.x}px; top:250px;">term: <b>"${term}"</b> · call ${call} of 4</div>`
      : "";

    const cellsHtml = Array.from({ length: 16 }, (_, i) => {
      const cls = touched.has(i) ? "touched" : "idle";
      return `<div class="agsearch-cell ${cls}">📄</div>`;
    }).join("");

    return `
      ${kicker ? `<div class="kicker">${kicker}</div>` : ""}
      <div class="agsearch-stage">
        <div class="agsearch-box">
          <svg class="agsearch-lines" viewBox="0 0 1500 560">${linesHtml}</svg>
          <div class="agsearch-agent" style="left:${AGSEARCH_AGENT.x}px; top:${AGSEARCH_AGENT.y}px;"><div class="icon">🤖</div><div class="label">Agent</div></div>
          ${toolsHtml}
          ${termHtml}
          <div class="agsearch-corpus-wrap" style="left:750px; top:280px; transform:translateX(-50%);">
            <div class="agsearch-corpus-label">CORPUS</div>
            <div class="agsearch-corpus-grid">${cellsHtml}</div>
          </div>
        </div>
        <div class="agsearch-meter-wrap">
          <div class="agsearch-meter-label">${costLabel}</div>
          <div class="agsearch-meter-track"><div class="agsearch-meter-fill ${costClass}" style="width:${costPct}%"></div></div>
        </div>
      </div>
    `;
  }

  window.setAgenticSearchStep = function (kicker, n) {
    hideAllViews();
    eyebrowEl.style.opacity = 1;
    const cost = AGSEARCH_COST[n - 1];
    glowEl.style.background = cost <= 3 ? "#2e9e5b" : cost <= 6 ? "#d6a93a" : "#cf5d3f";
    contentEl.innerHTML = buildAgenticSearch(kicker, n);
    void contentEl.offsetWidth;
    contentEl.classList.add("show");
  };

  // ---------- embedding space (chapter 4) ----------
  // Fixed-coordinate SVG scatter, two snapshots: (1) just the "meaning
  // space" with topic clusters, to make the vector-space idea concrete;
  // (2) add a query point + dashed lines to its two nearest neighbours,
  // to make "closest ≈ most relevant" visible rather than asserted.
  const EMBED_CLUSTERS = [
    { key: "a", color: "#5b3fae", points: [[160,110],[230,90],[190,180],[260,160],[140,200]] },
    { key: "b", color: "#2e9e5b", points: [[620,140],[700,110],[660,210],[730,190],[600,230]] },
    { key: "c", color: "#cf5d3f", points: [[380,380],[460,350],[420,440],[500,420],[350,460]] },
  ];
  const EMBED_QUERY = [210, 150];
  const EMBED_NEAREST = [[190,180],[260,160]]; // cluster-a points 2 and 3

  function buildEmbedSpace(kicker, n) {
    const showQuery = n === 2;
    const nearestSet = new Set(EMBED_NEAREST.map(String));
    const circles = EMBED_CLUSTERS.flatMap((c) =>
      c.points.map(([x, y]) => {
        const isNearest = showQuery && nearestSet.has(String([x, y]));
        const dim = showQuery && c.key !== "a";
        const r = isNearest ? 13 : 9;
        const stroke = isNearest ? "#2e9e5b" : "none";
        const opacity = dim ? 0.25 : 1;
        return `<circle cx="${x}" cy="${y}" r="${r}" fill="${c.color}" fill-opacity="${opacity}" stroke="${stroke}" stroke-width="4"/>`;
      })
    ).join("");
    const lines = showQuery
      ? EMBED_NEAREST.map(([x, y]) => `<line x1="${EMBED_QUERY[0]}" y1="${EMBED_QUERY[1]}" x2="${x}" y2="${y}" stroke="#2e9e5b" stroke-width="3" stroke-dasharray="8,8"/>`).join("")
      : "";
    const query = showQuery
      ? `<g>
           <path d="M${EMBED_QUERY[0]},${EMBED_QUERY[1] - 16} l16,16 l-16,16 l-16,-16 Z" fill="#1d1f2b"/>
           <text x="${EMBED_QUERY[0]}" y="${EMBED_QUERY[1] - 28}" text-anchor="middle" font-family="SF Mono, monospace" font-size="19" fill="#1d1f2b" font-weight="600">QUERY</text>
         </g>`
      : "";
    const caption = showQuery
      ? `<text x="450" y="525" text-anchor="middle" font-family="SF Mono, monospace" font-size="19" fill="#1f6b3d" font-weight="600">closest ⇒ most relevant</text>`
      : "";

    return `
      ${kicker ? `<div class="kicker">${kicker}</div>` : ""}
      <div class="embed-space-wrap">
        <div class="embed-space-box">
          <div class="embed-space-box-label">MEANING SPACE</div>
          <svg width="900" height="560" viewBox="0 0 900 560">
            ${circles}${lines}${query}${caption}
          </svg>
        </div>
        <div class="embed-legend">
          <span><span class="dot" style="background:#5b3fae"></span>contract clauses</span>
          <span><span class="dot" style="background:#2e9e5b"></span>safety procedures</span>
          <span><span class="dot" style="background:#cf5d3f"></span>financial terms</span>
        </div>
      </div>
    `;
  }

  window.setEmbedSpaceStep = function (kicker, n) {
    hideAllViews();
    eyebrowEl.style.opacity = 1;
    glowEl.style.background = "#5b3fae";
    contentEl.innerHTML = buildEmbedSpace(kicker, n);
    void contentEl.offsetWidth;
    contentEl.classList.add("show");
  };

  // ---------- ingestion overview (chapter 5) ----------
  // The chapter's opening map: one document branching into the four
  // standard preprocessing steps, all funneling into a single "index" node
  // -- the concrete, automated counterpart to the "back of a book" analogy
  // from the scene right before this one. Everything the rest of the
  // chapter covers (OCR detail, embeddings detail, metadata/tags, the
  // boilerplate trap) is one branch of this map, zoomed in.
  const INGOV_DOC = { x: 150, y: 310 };
  const INGOV_STEPS = [
    { x: 620, y: 90, icon: "🔤", label: "OCR → text" },
    { x: 620, y: 243, icon: "🏷", label: "Tags & summary" },
    { x: 620, y: 396, icon: "🗂", label: "Metadata: timestamp, file/folder" },
    { x: 620, y: 549, icon: "🧭", label: "Embeddings" },
  ];
  const INGOV_INDEX = { x: 1280, y: 310, icon: "📇", label: "THE INDEX" };

  // Point where the line from (fromX,fromY) toward (toX,toY) crosses the
  // boundary of a halfW x halfH box centered on (fromX,fromY) -- used so
  // connector lines stop at a node's actual rendered edge instead of
  // piercing into its icon/label. Box sizes vary with label length (e.g.
  // the two-line metadata label below), so this is measured per node at
  // render time, not guessed as fixed pixel constants.
  function rectEdgePoint(fromX, fromY, toX, toY, halfW, halfH) {
    const dx = toX - fromX, dy = toY - fromY;
    if (dx === 0 && dy === 0) return { x: fromX, y: fromY };
    const scale = Math.min(dx !== 0 ? halfW / Math.abs(dx) : Infinity, dy !== 0 ? halfH / Math.abs(dy) : Infinity);
    return { x: fromX + dx * scale, y: fromY + dy * scale };
  }

  function buildIngestionOverview(kicker) {
    const node = (n, cls) => `<div class="fanout-node ${cls || ""}" style="left:${n.x}px; top:${n.y}px;"><div class="icon">${n.icon}</div><div class="label">${n.label}</div></div>`;
    return `
      ${kicker ? `<div class="kicker">${kicker}</div>` : ""}
      <div class="ingov-box">
        <svg class="ingov-lines" viewBox="0 0 1500 620"></svg>
        <div class="fanout-node doc" style="left:${INGOV_DOC.x}px; top:${INGOV_DOC.y}px;"><div class="icon">📄</div><div class="label">One document</div></div>
        ${INGOV_STEPS.map((s) => node(s)).join("")}
        ${node(INGOV_INDEX, "index")}
      </div>
    `;
  }

  window.setIngestionOverview = function (kicker) {
    hideAllViews();
    eyebrowEl.style.opacity = 1;
    glowEl.style.background = "#5b3fae";
    contentEl.innerHTML = buildIngestionOverview(kicker);
    void contentEl.offsetWidth;
    contentEl.classList.add("show");

    // Lines drawn post-layout, from each node's measured rendered size.
    const svg = contentEl.querySelector(".ingov-lines");
    const allNodes = contentEl.querySelectorAll(".ingov-box .fanout-node");
    const docEl = allNodes[0];
    const stepEls = Array.from(allNodes).slice(1, 1 + INGOV_STEPS.length);
    const indexEl = allNodes[allNodes.length - 1];
    const half = (el) => ({ w: el.offsetWidth / 2, h: el.offsetHeight / 2 });
    const docHalf = half(docEl);
    const indexHalf = half(indexEl);
    const lines = INGOV_STEPS.map((s, i) => {
      const stepHalf = half(stepEls[i]);
      const p1 = rectEdgePoint(INGOV_DOC.x, INGOV_DOC.y, s.x, s.y, docHalf.w, docHalf.h);
      const p2 = rectEdgePoint(s.x, s.y, INGOV_DOC.x, INGOV_DOC.y, stepHalf.w, stepHalf.h);
      const p3 = rectEdgePoint(s.x, s.y, INGOV_INDEX.x, INGOV_INDEX.y, stepHalf.w, stepHalf.h);
      const p4 = rectEdgePoint(INGOV_INDEX.x, INGOV_INDEX.y, s.x, s.y, indexHalf.w, indexHalf.h);
      return `<line x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" stroke="#5b3fae" stroke-width="3"/>`
           + `<line x1="${p3.x}" y1="${p3.y}" x2="${p4.x}" y2="${p4.y}" stroke="#9fd4b4" stroke-width="2.5" stroke-dasharray="7,7"/>`;
    }).join("");
    svg.innerHTML = lines;
  };

  // ---------- embedding fan-out (chapter 5) ----------
  // Fixed-coordinate layout: one document, three embeddings fanning out of
  // it, converging on an explicitly unresolved "?" hub that forks into the
  // two strategies -- average vs. keep separate -- neither one marked as
  // the answer, matching the narration's open question.
  const FANOUT_DOC = { x: 150, y: 280 };
  const FANOUT_NODES = [
    { x: 560, y: 110, icon: "📝", label: "Page text embedding" },
    { x: 560, y: 280, icon: "🖼", label: "Page image embedding" },
    { x: 560, y: 450, icon: "📘", label: "Whole-document embedding" },
  ];
  const FANOUT_HUB = { x: 930, y: 280 };
  const FANOUT_STRATEGIES = [
    { x: 1290, y: 150, icon: "➗", label: "Average into one vector" },
    { x: 1290, y: 410, icon: "🔀", label: "Keep separate — search across all" },
  ];

  // Point where the line from (fromX,fromY) toward (toX,toY) crosses a
  // circle of the given radius centered on (fromX,fromY) -- used for the
  // round "?" hub, where a rect-edge calculation would be wrong.
  function circleEdgePoint(fromX, fromY, toX, toY, radius) {
    const dx = toX - fromX, dy = toY - fromY;
    const dist = Math.hypot(dx, dy) || 1;
    return { x: fromX + (dx / dist) * radius, y: fromY + (dy / dist) * radius };
  }

  function buildFanout(kicker) {
    const node = (n, cls) => `<div class="fanout-node ${cls || ""}" style="left:${n.x}px; top:${n.y}px;"><div class="icon">${n.icon}</div><div class="label">${n.label}</div></div>`;
    return `
      ${kicker ? `<div class="kicker">${kicker}</div>` : ""}
      <div class="fanout-box">
        <svg class="fanout-lines" viewBox="0 0 1500 560"></svg>
        <div class="fanout-node doc" style="left:${FANOUT_DOC.x}px; top:${FANOUT_DOC.y}px;"><div class="icon">📄</div><div class="label">One document</div></div>
        ${FANOUT_NODES.map((n) => node(n)).join("")}
        <div class="fanout-node question" style="left:${FANOUT_HUB.x}px; top:${FANOUT_HUB.y}px;">?</div>
        ${FANOUT_STRATEGIES.map((s) => node(s, "strategy")).join("")}
      </div>
    `;
  }

  window.setFanoutStep = function (kicker) {
    hideAllViews();
    eyebrowEl.style.opacity = 1;
    glowEl.style.background = "#5b3fae";
    contentEl.innerHTML = buildFanout(kicker);
    void contentEl.offsetWidth;
    contentEl.classList.add("show");

    // Lines drawn post-layout, from each node's measured rendered size, so
    // they stop at the actual box/circle edge instead of piercing icons.
    const svg = contentEl.querySelector(".fanout-lines");
    const docEl = contentEl.querySelector(".fanout-node.doc");
    const hubEl = contentEl.querySelector(".fanout-node.question");
    const nodeEls = Array.from(contentEl.querySelectorAll(".fanout-node")).filter(
      (el) => !el.classList.contains("doc") && !el.classList.contains("question") && !el.classList.contains("strategy")
    );
    const strategyEls = Array.from(contentEl.querySelectorAll(".fanout-node.strategy"));
    const half = (el) => ({ w: el.offsetWidth / 2, h: el.offsetHeight / 2 });
    const docHalf = half(docEl);
    const hubRadius = hubEl.offsetWidth / 2;
    const lines = [
      ...FANOUT_NODES.map((n, i) => {
        const h = half(nodeEls[i]);
        const p1 = rectEdgePoint(FANOUT_DOC.x, FANOUT_DOC.y, n.x, n.y, docHalf.w, docHalf.h);
        const p2 = rectEdgePoint(n.x, n.y, FANOUT_DOC.x, FANOUT_DOC.y, h.w, h.h);
        return `<line x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" stroke="#5b3fae" stroke-width="3"/>`;
      }),
      ...FANOUT_NODES.map((n, i) => {
        const h = half(nodeEls[i]);
        const p1 = rectEdgePoint(n.x, n.y, FANOUT_HUB.x, FANOUT_HUB.y, h.w, h.h);
        const p2 = circleEdgePoint(FANOUT_HUB.x, FANOUT_HUB.y, n.x, n.y, hubRadius);
        return `<line x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" stroke="#c7bbe8" stroke-width="2.5" stroke-dasharray="7,7"/>`;
      }),
      ...FANOUT_STRATEGIES.map((s, i) => {
        const h = half(strategyEls[i]);
        const p1 = circleEdgePoint(FANOUT_HUB.x, FANOUT_HUB.y, s.x, s.y, hubRadius);
        const p2 = rectEdgePoint(s.x, s.y, FANOUT_HUB.x, FANOUT_HUB.y, h.w, h.h);
        return `<line x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" stroke="#d6a93a" stroke-width="2.5" stroke-dasharray="7,7"/>`;
      }),
    ].join("");
    svg.innerHTML = lines;
  };

  // ---------- chat citations (chapter 6, the UI aspect) ----------
  // A plain chat Q&A, except the assistant's answer carries numbered
  // citation badges that match numbered source-excerpt cards alongside it.
  // No connector lines needed -- the shared number is the connection,
  // same convention as real citation UIs.
  const CITUI_SOURCES = [
    { file: "switchgear_diagram.pdf — p.4", before: "...CB-12 routes to ", mark: "Panel 3", after: " via the east distribution board..." },
    { file: "wiring_update_2024.pdf — p.1", before: "...confirmed the ", mark: "routing", after: " as of the March revision..." },
  ];

  function buildChatCitations(kicker) {
    const cardsHtml = CITUI_SOURCES.map((s, i) => `
      <div class="citui-card">
        <div class="num">${i + 1}</div>
        <div class="body">
          <div class="file">${s.file}</div>
          <div class="snippet">${s.before}<mark>${s.mark}</mark>${s.after}</div>
        </div>
      </div>
    `).join("");

    return `
      ${kicker ? `<div class="kicker">${kicker}</div>` : ""}
      <div class="citui-wrap">
        <div class="citui-chat">
          <div class="citui-bubble user">Which breaker feeds Panel 3?</div>
          <div class="citui-bubble assistant">Breaker CB-12 feeds Panel 3<span class="citui-cite">1</span>, confirmed by the updated wiring diagram<span class="citui-cite">2</span>.</div>
        </div>
        <div class="citui-sources">
          <div class="citui-source-label">SOURCES</div>
          ${cardsHtml}
        </div>
      </div>
    `;
  }

  window.setChatCitations = function (kicker) {
    hideAllViews();
    eyebrowEl.style.opacity = 1;
    glowEl.style.background = "#5b3fae";
    contentEl.innerHTML = buildChatCitations(kicker);
    void contentEl.offsetWidth;
    contentEl.classList.add("show");
  };

  // ---------- eval question-gen table (new evaluation chapter) ----------
  // One generated question per section, and whether retrieval actually
  // surfaces that section again -- the concrete mechanics behind "build a
  // small evaluation set." Deliberately includes one miss (not a clean
  // 4-for-4) to keep the "imperfect signal" framing honest.
  const EQTABLE_ROWS = [
    { section: "§2 — Panel wiring", question: "Which breaker feeds Panel 3?", found: true },
    { section: "§5 — Permits", question: "When does the permit expire?", found: true },
    { section: "§7 — Fire safety", question: "Who is the fire-safety contact?", found: false },
    { section: "§9 — Heat pump spec", question: "What's the unit's rated output?", found: true },
  ];

  function buildEvalQuestionGen(kicker) {
    const hits = EQTABLE_ROWS.filter((r) => r.found).length;
    const rowsHtml = EQTABLE_ROWS.map((r) => `
      <div class="eqtable-row">
        <div class="section">${r.section}</div>
        <div class="question">"${r.question}"</div>
        <div class="eqtable-verdict ${r.found ? "yes" : "no"}">${r.found ? "✓ found" : "✕ missed"}</div>
      </div>
    `).join("");

    return `
      ${kicker ? `<div class="kicker">${kicker}</div>` : ""}
      <div class="eqtable">
        <div class="eqtable-head">
          <div class="cell">SECTION</div>
          <div class="cell">GENERATED QUESTION</div>
          <div class="cell">RETRIEVAL FINDS IT?</div>
        </div>
        ${rowsHtml}
        <div class="eqtable-footer">Hit rate: <b>${hits} / ${EQTABLE_ROWS.length}</b> sections found</div>
      </div>
    `;
  }

  window.setEvalQuestionGen = function (kicker) {
    hideAllViews();
    eyebrowEl.style.opacity = 1;
    glowEl.style.background = "#5b3fae";
    contentEl.innerHTML = buildEvalQuestionGen(kicker);
    void contentEl.offsetWidth;
    contentEl.classList.add("show");
  };

  // ---------- LLM as judge (new evaluation chapter) ----------
  // Question + candidate answer + source document converge on a judge
  // model, which scores concrete criteria -- the mechanism behind
  // automating the one thing that's hardest to grade: the final answer.
  const JUDGE_INPUTS = [
    { x: 150, y: 110, icon: "❓", label: "Question" },
    { x: 150, y: 300, icon: "💬", label: "Candidate answer" },
    { x: 150, y: 490, icon: "📄", label: "Source document" },
  ];
  const JUDGE_NODE = { x: 750, y: 300, icon: "⚖️", label: "Judge LLM" };
  const JUDGE_VERDICT = { x: 1280, y: 300 };
  const JUDGE_CRITERIA = [
    { label: "Faithful to source", mark: "✓" },
    { label: "Grounded in retrieved text", mark: "✓" },
    { label: "Relevant to the question", mark: "✓" },
  ];

  function buildLlmJudge(kicker) {
    const lines = [
      ...JUDGE_INPUTS.map((n) => `<line x1="${n.x}" y1="${n.y}" x2="${JUDGE_NODE.x}" y2="${JUDGE_NODE.y}" stroke="#5b3fae" stroke-width="3"/>`),
      `<line x1="${JUDGE_NODE.x}" y1="${JUDGE_NODE.y}" x2="${JUDGE_VERDICT.x}" y2="${JUDGE_VERDICT.y}" stroke="#2e9e5b" stroke-width="3"/>`,
    ].join("");
    const node = (n) => `<div class="fanout-node" style="left:${n.x}px; top:${n.y}px;"><div class="icon">${n.icon}</div><div class="label">${n.label}</div></div>`;
    const criteriaHtml = JUDGE_CRITERIA.map((c) => `<div class="row"><span>${c.label}</span><span>${c.mark}</span></div>`).join("");

    return `
      ${kicker ? `<div class="kicker">${kicker}</div>` : ""}
      <div class="judge-box">
        <svg class="judge-lines" viewBox="0 0 1500 600">${lines}</svg>
        ${JUDGE_INPUTS.map((n) => node(n)).join("")}
        <div class="fanout-node doc" style="left:${JUDGE_NODE.x}px; top:${JUDGE_NODE.y}px;"><div class="icon">${JUDGE_NODE.icon}</div><div class="label">${JUDGE_NODE.label}</div></div>
        <div class="judge-verdict" style="left:${JUDGE_VERDICT.x}px; top:${JUDGE_VERDICT.y}px;">${criteriaHtml}</div>
      </div>
    `;
  }

  window.setLlmJudge = function (kicker) {
    hideAllViews();
    eyebrowEl.style.opacity = 1;
    glowEl.style.background = "#2e9e5b";
    contentEl.innerHTML = buildLlmJudge(kicker);
    void contentEl.offsetWidth;
    contentEl.classList.add("show");
  };

  // ---------- boilerplate trap (chapter 5) ----------
  // Three documents on three unrelated topics, each with a near-identical
  // boilerplate section. A query about none of them still draws a dashed
  // "match" line into all three boilerplate sections -- the false positive
  // the narration flags, made visible instead of just asserted.
  const BOILER_DOCS = [
    { x: 280, y: 380, unique: "Switchgear spec", color: "#5b3fae" },
    { x: 750, y: 380, unique: "Heat pump manual", color: "#2e9e5b" },
    { x: 1220, y: 380, unique: "Fire-safety permit", color: "#cf5d3f" },
  ];
  const BOILER_QUERY = { x: 750, y: 60 };

  function buildBoilerplate(kicker) {
    const lines = BOILER_DOCS.map((d) => `<line x1="${BOILER_QUERY.x}" y1="${BOILER_QUERY.y}" x2="${d.x}" y2="${d.y + 95}" stroke="#c0392b" stroke-width="3" stroke-dasharray="8,8"/>`).join("");
    const docsHtml = BOILER_DOCS.map((d) => `
      <div class="boiler-doc" style="left:${d.x}px; top:${d.y}px;">
        <div class="unique" style="color:${d.color};">${d.unique}</div>
        <div class="boilerplate">Standard Privacy Clause</div>
      </div>
    `).join("");
    return `
      ${kicker ? `<div class="kicker">${kicker}</div>` : ""}
      <div class="boiler-box">
        <svg class="boiler-lines" viewBox="0 0 1500 560">${lines}</svg>
        <div class="boiler-query" style="left:${BOILER_QUERY.x}px; top:${BOILER_QUERY.y}px;">
          <div class="icon">🔎</div>
          <div class="label">A question about none of these</div>
        </div>
        ${docsHtml}
      </div>
      <div class="boiler-caption">Boilerplate looks "relevant" to all three. It isn't.</div>
    `;
  }

  window.setBoilerplateStep = function (kicker) {
    hideAllViews();
    eyebrowEl.style.opacity = 1;
    glowEl.style.background = "#cf5d3f";
    contentEl.innerHTML = buildBoilerplate(kicker);
    void contentEl.offsetWidth;
    contentEl.classList.add("show");
  };

  // ---------- evaluation matrix (chapter 8) ----------
  // Three build-ladder stages (same labels as chapter 7) x what's
  // measurable. Azure AI Search sits dimmed-but-visible throughout (the
  // narration never calls it out explicitly, but it answers the "what
  // about stage B" question the chapter otherwise leaves open) while
  // custom and Copilot get highlighted in turn across the two steps.
  const EVAL_STAGES = [
    { key: "custom", label: "Fully custom pipeline" },
    { key: "azure", label: "Azure AI Search — hybrid, managed" },
    { key: "copilot", label: "Copilot agent + knowledge base" },
  ];
  const EVAL_COLS = ["Retrieval<br>measurable alone", "Generation<br>measurable alone", "Only end-to-end<br>judgable"];
  const EVAL_CELLS = {
    custom: ["yes", "yes", "no"],
    azure: ["yes", "yes", "no"],
    copilot: ["no", "no", "yes"],
  };
  const EVAL_ROW_STATE = {
    1: { custom: "active", azure: "dim", copilot: "pending" },
    2: { custom: "done", azure: "dim", copilot: "active" },
  };

  function buildEvalMatrix(kicker, n) {
    const state = EVAL_ROW_STATE[n] || EVAL_ROW_STATE[1];
    const head = `
      <div class="evalmatrix-head">
        <div class="cell"></div>
        ${EVAL_COLS.map((c) => `<div class="cell">${c}</div>`).join("")}
      </div>`;
    const rows = EVAL_STAGES.map((s) => {
      const cells = EVAL_CELLS[s.key].map((v) => `<div class="evalmatrix-cell ${v}">${v === "yes" ? "✓" : "✕"}</div>`).join("");
      return `<div class="evalmatrix-row ${state[s.key]}"><div class="stage-label">${s.label}</div>${cells}</div>`;
    }).join("");
    return `
      ${kicker ? `<div class="kicker">${kicker}</div>` : ""}
      <div class="evalmatrix">${head}${rows}</div>
    `;
  }

  window.setEvalMatrixStep = function (kicker, n) {
    hideAllViews();
    eyebrowEl.style.opacity = 1;
    glowEl.style.background = n === 2 ? "#cf5d3f" : "#5b3fae";
    contentEl.innerHTML = buildEvalMatrix(kicker, n);
    void contentEl.offsetWidth;
    contentEl.classList.add("show");
  };

  // ---------- generic scene renderer ----------
  // Single entry point the framework driver (and manual-browse mode) calls with
  // one storyline scene's `visual` object. Keeps the driver decoupled from this
  // deck's specific function/group names.
  function slideDataFromVisual(visual) {
    const data = { style: visual.style };
    if (visual.style === "cta") {
      data.content = applyHighlights(visual.content || "");
    } else if (visual.style === "image") {
      data.src = visual.src || "";
      data.citation = visual.citation || "";
      data.alt = visual.alt || "";
    } else if (visual.style === "stat") {
      data.number = visual.number || "";
      data.label = applyHighlights(visual.label || "");
      data.sub = visual.sub || "";
    } else {
      const content = applyHighlights(visual.content || "");
      data.lines = content ? content.split("\n") : [];
    }
    if (visual.kicker) data.kicker = visual.kicker;
    return data;
  }

  window.renderScene = function (visual) {
    if (visual.kind === "text_slide") {
      window.goToSlide(slideDataFromVisual(visual));
    } else if (visual.kind === "checklist_step") {
      window.setChecklistStep(visual.kicker, visual.items, visual.step);
    } else if (visual.kind === "context_fill_step") {
      window.setCtxFillStep(visual.kicker, visual.step);
    } else if (visual.kind === "agentic_search_step") {
      window.setAgenticSearchStep(visual.kicker, visual.step);
    } else if (visual.kind === "embedding_space_step") {
      window.setEmbedSpaceStep(visual.kicker, visual.step);
    } else if (visual.kind === "ingestion_overview") {
      window.setIngestionOverview(visual.kicker);
    } else if (visual.kind === "embedding_fanout") {
      window.setFanoutStep(visual.kicker);
    } else if (visual.kind === "boilerplate_trap") {
      window.setBoilerplateStep(visual.kicker);
    } else if (visual.kind === "eval_matrix_step") {
      window.setEvalMatrixStep(visual.kicker, visual.step);
    } else if (visual.kind === "chat_citations") {
      window.setChatCitations(visual.kicker);
    } else if (visual.kind === "eval_question_gen") {
      window.setEvalQuestionGen(visual.kicker);
    } else if (visual.kind === "llm_judge") {
      window.setLlmJudge(visual.kicker);
    } else {
      throw new Error("Unknown visual.kind: " + visual.kind);
    }
  };

  // ---------- manual browsing mode (default view; recorder opts out via ?record=1) ----------
  if (!new URLSearchParams(location.search).has("record") && typeof DECK_SCENES !== "undefined") {
    document.body.classList.add("manual-mode");

    // the stage is a fixed 1920x1080 canvas; scale-to-fit + center it in the
    // actual browser window instead of letting it get silently clipped.
    const stageEl = document.querySelector(".stage");
    function fitStage() {
      const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
      stageEl.style.transform = `translate(-50%, -50%) scale(${scale})`;
    }
    fitStage();
    window.addEventListener("resize", fitStage);

    let idx = 0;
    const dotsWrap = document.getElementById("manual-dots");
    const counterEl = document.getElementById("manual-counter");

    DECK_SCENES.forEach((entry, i) => {
      const dot = document.createElement("button");
      dot.className = "dot";
      dot.title = `scene ${entry.id}`;
      dot.addEventListener("click", () => { idx = i; render(); });
      dotsWrap.appendChild(dot);
    });
    const dotEls = dotsWrap.querySelectorAll(".dot");

    const speakerPanelBody = document.getElementById("speaker-panel-body");

    function render() {
      window.renderScene(DECK_SCENES[idx].visual);
      counterEl.textContent = `${idx + 1} / ${DECK_SCENES.length}`;
      dotEls.forEach((d, i) => d.classList.toggle("on", i === idx));
      speakerPanelBody.textContent = DECK_SCENES[idx].text || "(no narration text)";
    }

    document.getElementById("manual-next").addEventListener("click", () => {
      idx = (idx + 1) % DECK_SCENES.length; render();
    });
    document.getElementById("manual-prev").addEventListener("click", () => {
      idx = (idx - 1 + DECK_SCENES.length) % DECK_SCENES.length; render();
    });
    document.getElementById("manual-toggle-text").addEventListener("click", () => {
      document.body.classList.toggle("hide-speaker-text");
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight") document.getElementById("manual-next").click();
      if (e.key === "ArrowLeft") document.getElementById("manual-prev").click();
      if (e.key.toLowerCase() === "t") document.getElementById("manual-toggle-text").click();
    });

    render();
  }
</script>
