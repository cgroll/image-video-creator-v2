# ============================================================
# PART 2 OPENER — short intro + recap of part 1, before customization content
# ============================================================
- id: 1
  text: "Welcome back — this is part two. Part one covered the fundamentals: what an agent is, what a harness is, and why context matters so much. Before we get practical, a quick recap of where we left off."
  visual:
    kind: text_slide
    style: cta
    kicker: "PART 2 OF 2"
    content: "Context Is King"

- id: 2
  text: "Quick reminder: an agent is a model that reasons, uses tools, and keeps context and memory. All of that runs inside a harness — the loop that gathers context, then acts. And a decent model with a great harness beats a great model with a bad one."
  visual:
    kind: checklist_step
    kicker: "RECAP: THE FUNDAMENTALS"
    items:
      - "An agent = a model that reasons, uses tools, and keeps context"
      - "The harness = the loop that gathers context, then acts"
      - "A decent model with a great harness beats a great model with a bad one"
    step: 3

- id: 3
  text: "And two more things from part one worth keeping in mind: rich tools plus easy, local access to content are why a tool like Claude Code works so well — fragmented data across separate systems makes that same job much harder. And the interface wrapped around the harness matters just as much as the harness itself."
  visual:
    kind: checklist_step
    kicker: "RECAP: WHY THE HARNESS MATTERS"
    items:
      - "Rich tools and easy local access are why Claude Code works so well"
      - "Fragmented data — like M365 Copilot's four databases — makes the same job harder"
      - "The interface around the harness — voice, remote, approvals, branching — matters too"
    step: 3

# ============================================================
# CHAPTER 4 — Instructions, Tools, Skills, Context: one template in detail
# ============================================================
- id: 4
  text: "So here's the real question I want to get at: how do I actually customize this further, to squeeze a bigger productivity boost out of it? Let's ground that in a real repo — my own project template — instead of a toy example."
  visual:
    kind: text_slide
    style: cta
    kicker: "HOW DO I CUSTOMIZE THIS FURTHER?"
    content: "Instructions · Tools · Skills · Context"

- id: 5
  text: "Let's look at four dimensions we actually have some influence over — four things we can shape to our advantage. First, instructions: whatever's true every single session, no matter the task."
  visual:
    kind: checklist_step
    kicker: "FOUR AXES, FOUR PURPOSES"
    items:
      - icon: doc
        text: "Instructions — true every session, no matter the task"
        subitems:
          - { icon: lock, text: "Closed consumer app — the system prompt is entirely hidden" }
          - { icon: wrench, text: "Claude Code — closed-source, but a separate flag can append or replace it" }
          - { icon: eye, text: "Pi Coding Agent — fully open source, read and override directly" }
      - { icon: layers, text: "Context — found or written, specific to this task right now" }
      - { icon: bulb, text: "Skills — how-to knowledge, loaded only when the task needs it" }
      - { icon: wrench, text: "Tools — new capability the model didn't have before" }
    step: 1

- id: 6
  text: "One layer down, worth naming: how much you can actually touch 'Instructions' varies a lot. Sometimes you get direct, editable access to it; sometimes you don't — and how locked that layer is turns out to be a spectrum. In a closed consumer app, it's entirely hidden. Claude Code sits in the middle: closed-source, but it gives you a separate, official flag to append to, or even fully replace, that system prompt for a session. A fully open harness like Pi Coding Agent goes further still — the whole thing is public source on GitHub, readable and overridable directly. Though even there, the underlying model weights and the provider's own guardrails stay locked no matter what."
  visual:
    kind: checklist_step
    kicker: "FOUR AXES, FOUR PURPOSES"
    items:
      - icon: doc
        text: "Instructions — true every session, no matter the task"
        subitems:
          - { icon: lock, text: "Closed consumer app — the system prompt is entirely hidden" }
          - { icon: wrench, text: "Claude Code — closed-source, but a separate flag can append or replace it" }
          - { icon: eye, text: "Pi Coding Agent — fully open source, read and override directly" }
      - { icon: layers, text: "Context — found or written, specific to this task right now" }
      - { icon: bulb, text: "Skills — how-to knowledge, loaded only when the task needs it" }
      - { icon: wrench, text: "Tools — new capability the model didn't have before" }
    step: 1
    expand: { index: 0, count: 3 }

- id: 7
  text: "Second, context is different — it's whatever has to be found, or already written, specifically for the task in front of you right now."
  visual:
    kind: checklist_step
    kicker: "FOUR AXES, FOUR PURPOSES"
    items:
      - icon: doc
        text: "Instructions — true every session, no matter the task"
        subitems:
