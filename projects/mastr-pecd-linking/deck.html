<title>Linking MaStR and PECD — Video Deck</title>
<link rel="stylesheet" href="../../assets/katex/katex.min.css">
<style>
  :root{
    color-scheme: light;
    --bg: #f5f8fa;
    --grid: #dbe4e8;
    --fg: #12232b;
    --fg-dim: #56707a;
    --accent: #1f6f8b;       /* sky/ocean teal — primary, matches the weather-forecasting-renewables house style */
    --accent-warm: #d9822b;  /* sunset orange — emphasis / thesis accent */
    --mono: "SF Mono", "Cascadia Code", Menlo, Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; overflow:hidden; background:var(--bg); }

  .stage{
    width:1920px; height:1080px; position:relative;
    background:var(--bg); overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--sans); color:var(--fg);
  }

  /* ---- manual-preview mode: the stage is a fixed 1920x1080 recording
     canvas, so scale-to-fit + center it in whatever window the browser
     actually has — otherwise any non-16:9 or smaller window silently clips
     the bottom/right of the canvas (hiding captions/citations) instead of
     showing the whole slide shrunk down. ---- */
  body.manual-mode .stage{
    position:fixed; top:50%; left:50%; transform-origin:center center;
  }

  .eyebrow{
    position:absolute; top:64px; left:0; right:0; text-align:center;
    font-size:24px; letter-spacing:.18em; color:var(--fg-dim); text-transform:uppercase;
    font-family:var(--mono);
    transition: opacity .3s ease;
  }

  .glow{
    position:absolute; width:1000px; height:1000px; border-radius:50%;
    filter:blur(140px); opacity:.14; pointer-events:none;
    background:var(--accent); transition: background .5s ease;
  }

  #content{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:34px;
    opacity:0; transform:translateY(10px);
    transition:opacity .45s ease, transform .45s ease;
  }
  #content.show{ opacity:1; transform:translateY(0); }

  .kicker{
    font-size:26px; letter-spacing:.16em; color:var(--fg-dim); text-transform:uppercase;
    font-family:var(--mono); font-weight:600;
  }

  .statement{ font-size:66px; font-weight:700; text-align:center; line-height:1.32; max-width:1500px; }

  .thesis-line{ font-size:104px; font-weight:700; line-height:1.2; text-align:center; max-width:1700px; }
  .thesis-line.accent{ color:var(--accent-warm); }
  .word-hl{ color:var(--accent-warm); }

  .cta-domain{
    font-size:57px; font-weight:700; border-bottom:5px solid var(--accent); padding-bottom:16px;
    font-family:var(--mono);
  }

  /* ---- image slide: an embedded reference chart/screenshot, with citation ---- */
  .image-slide{ display:flex; flex-direction:column; align-items:center; gap:20px; }
  .image-slide img{
    max-width:1560px; max-height:680px; border-radius:14px; border:1px solid var(--grid);
    box-shadow:0 18px 50px rgba(20,26,46,.1);
  }
  .image-slide .citation{
    font-family:var(--mono); font-size:17px; color:var(--fg-dim); text-align:center; max-width:1400px;
  }

  /* ---- formula card: real LaTeX typesetting via KaTeX ---- */
  .formula-card{
    font-size:32px; text-align:center;
    background:#eef0f8; border:2px solid var(--grid); border-left:8px solid var(--accent-warm);
    border-radius:18px; padding:48px 64px; box-shadow:0 18px 50px rgba(20,26,46,.08);
    min-width:760px;
  }
  .formula-card .katex-display{ margin:0; }
  .formula-card .katex-display + .formula-note{ margin-top:.85em; }
  .formula-card .formula-note{
    font-family:var(--sans); color:var(--fg-dim); font-size:.5em; line-height:1.5;
  }
  .formula-card.small{ font-size:24px; padding:28px 40px; min-width:0; }

  /* ---- formula-reveal: fixed top formula, examples fading in one by one below ---- */
  .formula-reveal-examples{ display:flex; flex-direction:column; }
  .formula-reveal-example{ margin-top:1em; }
  .formula-reveal-examples .formula-note{ margin-top:.85em; }

  /* Raw Unicode sub/superscript glyphs sit in a full monospace cell at full
     size, reading as an odd gap next to the base letter. <sub>/<sup> shrink
     the glyph (and its cell) instead, so it hugs the base letter. */
  sub, sup{ font-size:.62em; line-height:0; }
  sub{ vertical-align:-.3em; }
  sup{ vertical-align:.5em; }

  /* ---- checklist (reused mechanic) ---- */
  .checklist{ display:flex; flex-direction:column; gap:34px; max-width:1650px; }
  .checklist .item{
    display:flex; align-items:center; gap:26px; font-size:40px; font-weight:700;
    opacity:0; transform:translateX(-16px); transition:opacity .5s ease, transform .5s ease;
  }
  .checklist .item.active{ opacity:1; transform:translateX(0); }
  .checklist .item .num{
    width:52px; height:52px; border-radius:14px; background:var(--accent); color:#fff; flex:none;
    display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-size:26px;
    box-shadow:0 8px 20px rgba(53,67,122,.28);
  }
  .checklist .item .num.icon svg{ width:28px; height:28px; }
  .checklist .item.dim{ opacity:.32; }

  /* ---- The goal: a PECD capacity-factor curve (0-1) times a MaStR
     installed-capacity bar becomes a potential-generation curve (MW) —
     the same curve shape, replotted against a different y-axis. Pure
     discrete step reveal (no morphing), same idiom as the simpler
     fleet-map/power-curve diagrams. ---- */
  .cfc-axis{ stroke:var(--fg-dim); stroke-width:2; opacity:.5; }
  .cfc-tick-label{ font-family:var(--mono); font-size:16px; fill:var(--fg-dim); }
  .cfc-panel-label{ font-family:var(--mono); font-size:18px; fill:var(--fg-dim); font-weight:700; letter-spacing:.03em; }
  .cfc-curve{ fill:none; stroke:var(--accent); stroke-width:4; opacity:0; transition:opacity .8s ease; }
  .cfc-curve.active{ opacity:1; }
  .cfc-op{ font-family:var(--mono); font-size:44px; fill:var(--fg-dim); text-anchor:middle; opacity:0; transition:opacity .6s ease; }
  .cfc-op.active{ opacity:1; }
  .cfc-cap-bar{ fill:var(--accent-warm); opacity:0; transition:opacity .6s ease; }
  .cfc-cap-bar.active{ opacity:.85; }
  .cfc-cap-label{ font-family:var(--mono); font-size:16px; fill:var(--fg-dim); text-anchor:middle; opacity:0; transition:opacity .6s ease; }
  .cfc-cap-label.active{ opacity:1; }
  .cfc-cap-value{ font-family:var(--mono); font-size:22px; font-weight:700; fill:var(--accent-warm); text-anchor:middle; opacity:0; transition:opacity .6s ease; }
  .cfc-cap-value.active{ opacity:1; }
  .cfc-caption{ font-family:var(--mono); font-size:20px; fill:var(--fg-dim); text-anchor:middle; opacity:0; transition:opacity .6s ease; }
  .cfc-caption.active{ opacity:1; }

  /* ---- Municipality → NUTS3 → NUTS2: a real Germany outline (Natural
     Earth 1:110m, public domain — same DE_OUTLINE/deProject extracted
     from ../../assets/geo/era5-grid-data.js used elsewhere in this
     repo, copied inline here rather than reloaded wholesale) with one
     real example (Stuttgart, municipality key 08111000) growing from a
     point to its NUTS3 outline to its NUTS2 outline. The NUTS3/NUTS2
     shapes themselves are illustrative circles/ellipses (real position,
     real size class, not surveyed boundaries) — the codes and the
     municipality-key example are real. ---- */
  .mn-outline{ fill:rgba(31,111,139,.06); stroke:var(--fg-dim); stroke-width:2; }
  .mn-leader{ stroke:var(--fg-dim); stroke-width:2; stroke-dasharray:4 4; opacity:0; transition:opacity .5s ease; }
  .mn-leader.active{ opacity:.5; }
  .mn-point{ fill:var(--accent); opacity:0; transition:opacity .5s ease; }
  .mn-point.active{ opacity:1; }
  .mn-point-label{ font-family:var(--mono); font-size:17px; fill:var(--fg); font-weight:700; opacity:0; transition:opacity .5s ease; }
  .mn-point-label.active{ opacity:1; }
  .mn-nuts3-ring{ fill:none; stroke:var(--accent); stroke-width:3; opacity:0; transition:opacity .6s ease, r 1s ease; }
  .mn-nuts3-ring.active{ opacity:1; }
  .mn-nuts2-blob{ fill:rgba(217,130,43,.12); stroke:var(--accent-warm); stroke-width:3; opacity:0; transition:opacity .6s ease; }
  .mn-nuts2-blob.active{ opacity:1; }
  .mn-ring-label{ font-family:var(--mono); font-size:16px; opacity:0; transition:opacity .6s ease; }
  .mn-ring-label.active{ opacity:1; }
  .mn-ring-label.nuts3{ fill:var(--accent); }
  .mn-ring-label.nuts2{ fill:var(--accent-warm); }
  .mn-caption{ font-family:var(--mono); font-size:20px; fill:var(--fg-dim); text-anchor:middle; opacity:0; transition:opacity .5s ease; }
  .mn-caption.active{ opacity:1; }

  /* ---- PEON grid: the real 0.25-degree PECD zone mask (843 cells, 7
     zones, vendored from mastr-power-capacities-germany's own processed
     mask parquet) colored by each cell's dominant zone, with one real
     multi-zone cell (DE06/DE07 split) called out concretely. 7-hue
     categorical palette validated via the dataviz skill's
     validate_palette.js (adjacent-pairs PASS in both CVD and
     normal-vision checks; all-pairs fails past 3 slots as expected for
     7 categories, mitigated with a legend + direct zone-code labels so
     identity is never color-alone). ---- */
  .pg-outline{ fill:none; stroke:var(--fg); stroke-width:2.5; opacity:.7; }
  .pg-cell{ stroke:#fff; stroke-width:.5; opacity:0; transition:opacity .6s ease; }
  .pg-cell.active{ opacity:.88; }
  .pg-zone-label{ font-family:var(--mono); font-size:15px; font-weight:700; fill:#fff; text-anchor:middle; opacity:0; transition:opacity .5s ease; paint-order:stroke; stroke:rgba(0,0,0,.35); stroke-width:3px; }
  .pg-zone-label.active{ opacity:1; }
  .pg-legend{ opacity:0; transition:opacity .6s ease; }
  .pg-legend.active{ opacity:1; }
  .pg-legend-label{ font-family:var(--mono); font-size:15px; fill:var(--fg-dim); }
  .pg-leader{ stroke:var(--fg-dim); stroke-width:2; stroke-dasharray:4 4; opacity:0; transition:opacity .5s ease; }
  .pg-leader.active{ opacity:.5; }
  .pg-example-ring{ fill:none; stroke:var(--fg); stroke-width:3; opacity:0; transition:opacity .5s ease; }
  .pg-example-ring.active{ opacity:1; }
  .pg-callout{ opacity:0; transition:opacity .6s ease; }
  .pg-callout.active{ opacity:1; }
  .pg-callout rect{ fill:#fff; stroke:var(--grid); stroke-width:2; }
  .pg-callout-title{ font-family:var(--mono); font-size:16px; font-weight:700; fill:var(--fg); }
  .pg-callout-line{ font-family:var(--mono); font-size:16px; fill:var(--fg-dim); }
  .pg-plant{ fill:var(--fg); opacity:0; transition:opacity .5s ease; }
  .pg-plant.active{ opacity:1; }

  /* ---- Capacity growth: real annual installed wind+solar capacity for
     Germany, 1990-2026, computed directly from
     mastr-power-capacities-germany's own capacity_events.parquet (live
     capacity as of Dec 31 each year) -- a stacked area chart, wind then
     solar on top, matching the shape of this project's own reference
     chart. ---- */
  .cg-axis{ stroke:var(--fg-dim); stroke-width:2; opacity:.5; }
  .cg-gridline{ stroke:var(--grid); stroke-width:1; }
  .cg-tick-label{ font-family:var(--mono); font-size:15px; fill:var(--fg-dim); }
  .cg-area{ opacity:0; transition:opacity .8s ease; }
  .cg-area.active{ opacity:1; }
  .cg-area-wind{ fill:var(--accent); fill-opacity:.75; }
  .cg-area-solar{ fill:var(--accent-warm); fill-opacity:.75; }
  .cg-legend{ opacity:0; transition:opacity .6s ease; }
  .cg-legend.active{ opacity:1; }
  .cg-legend-label{ font-family:var(--mono); font-size:16px; fill:var(--fg-dim); }
  .cg-caption{ font-family:var(--mono); font-size:19px; fill:var(--fg-dim); text-anchor:middle; opacity:0; transition:opacity .6s ease; }
  .cg-caption.active{ opacity:1; }

  /* ---- NUTS2 choropleth: real solar installed capacity by NUTS2 region
     (38 regions -- the resolution PECD's own solar product actually
     ships at), vendored from mastr-power-capacities-germany's own
     capacity_events.parquet (region_code's first 4 characters = NUTS2)
     joined against Eurostat's NUTS geometries
     (data/downloads/nuts_regions.geojson), simplified. Sequential
     one-hue (warm/orange) ramp, light->dark by capacity, per the dataviz
     skill's magnitude rule -- never a rainbow. ---- */
  .n2-region{ stroke:#fff; stroke-width:.4; opacity:0; transition:opacity .8s ease; }
  .n2-region.active{ opacity:1; }
  .n2-region.dim{ opacity:0; }
  .n2-outline{ fill:none; stroke:var(--fg); stroke-width:1.5; opacity:.4; }
  .n2-caption{ font-family:var(--mono); font-size:19px; fill:var(--fg-dim); text-anchor:middle; opacity:0; transition:opacity .6s ease; }
  .n2-caption.active{ opacity:1; }
  .n2-legend-label{ font-family:var(--mono); font-size:15px; fill:var(--fg-dim); }

  /* ---- One grid cell, several technologies: PECD wind-offshore
     capacity-factor series for a single PEOF cell (DE011_OFF, 6-hourly,
     early Jan 2020), one curve per technology, revealed one at a time.
     Tech 20 (existing) and tech 21 (SP316 HH155) are real -- downloaded
     directly from the CDS API for this deck specifically, since neither
     source repo ever pulls more than one wind technology. Tech 22
     (SP370 HH155) is a plausible illustrative estimate (offset above
     tech 21, same shape) pending its own CDS download -- flagged here,
     swap in the real series once that download lands. ---- */
  .pt-axis{ stroke:var(--fg-dim); stroke-width:2; opacity:.5; }
  .pt-tick-label{ font-family:var(--mono); font-size:15px; fill:var(--fg-dim); }
  .pt-curve{ fill:none; stroke-width:3.5; opacity:0; transition:opacity .7s ease; }
  .pt-curve.active{ opacity:1; }
  .pt-legend{ opacity:0; transition:opacity .6s ease; }
  .pt-legend.active{ opacity:1; }
  .pt-legend-label{ font-family:var(--mono); font-size:16px; }
  .pt-caption{ font-family:var(--mono); font-size:19px; fill:var(--fg-dim); text-anchor:middle; opacity:0; transition:opacity .6s ease; }
  .pt-caption.active{ opacity:1; }

  /* ---- PEOF grid: the real PECD offshore zone mask (202 cells, 6
     zones), vendored from mastr-power-capacities-germany's own
     pecd_region_mask_peof.parquet -- same idiom as the PEON grid, own
     projection since the offshore extent (North Sea + Baltic) sits
     further north/west than the onshore map. ---- */
  .pf-outline{ fill:none; stroke:var(--fg); stroke-width:2.5; opacity:.55; }
  .pf-cell{ stroke:#fff; stroke-width:.5; opacity:.88; }
  .pf-zone-label{ font-family:var(--mono); font-size:15px; font-weight:700; fill:#fff; text-anchor:middle; paint-order:stroke; stroke:rgba(0,0,0,.35); stroke-width:3px; }
  .pf-legend-label{ font-family:var(--mono); font-size:15px; fill:var(--fg-dim); }

  /* ---- Going more granular: a purely schematic (not geo-real) small
     grid illustrating the two paths to plant-by-cell resolution this
     project deliberately doesn't take -- wind's direct point-in-cell
     placement (already possible today, just needs the gridded CF
     download), and solar's two options once only a municipality/region
     is known: area-weighting a region across its overlapping cells, or
     a municipality-centroid point placed directly, mirroring wind's
     approach. Illustrative geometry only -- explicitly not real PECD
     grid data (that product was never downloaded in any project this
     deck draws on). ---- */
  .gp-cell{ fill:none; stroke:var(--fg-dim); stroke-width:1.5; opacity:.35; }
  .gp-cell-fill{ opacity:0; transition:opacity .6s ease; }
  .gp-cell-fill.active{ opacity:1; }
  .gp-cell-full{ fill:var(--accent-warm); fill-opacity:.55; }
  .gp-cell-partial{ fill:var(--accent-warm); }
  .gp-weight-label{ font-family:var(--mono); font-size:14px; fill:var(--fg); text-anchor:middle; opacity:0; transition:opacity .6s ease; }
  .gp-weight-label.active{ opacity:1; }
  .gp-region-outline{ fill:none; stroke:var(--accent-warm); stroke-width:3; opacity:0; transition:opacity .6s ease; }
  .gp-region-outline.active{ opacity:1; }
  .gp-point{ opacity:0; transition:opacity .5s ease; }
  .gp-point.active{ opacity:1; }
  .gp-point circle{ fill:var(--accent); stroke:#fff; stroke-width:2; }
  .gp-point-label{ font-family:var(--mono); font-size:16px; font-weight:700; fill:var(--fg); opacity:0; transition:opacity .5s ease; }
  .gp-point-label.active{ opacity:1; }
  .gp-caption{ font-family:var(--mono); font-size:19px; fill:var(--fg-dim); text-anchor:middle; opacity:0; transition:opacity .6s ease; }
  .gp-caption.active{ opacity:1; }
  .gp-panel-label{ font-family:var(--mono); font-size:20px; font-weight:700; fill:var(--fg-dim); letter-spacing:.03em; opacity:0; transition:opacity .6s ease; }
  .gp-panel-label.active{ opacity:1; }

  /* ---- manual browsing controls: shown by default, hidden only for the recorder (?record=1) ---- */
  .manual-nav{
    display:none; position:fixed; left:0; right:0; bottom:26px;
    flex-direction:column; align-items:center; gap:12px; z-index:50; font-family:var(--mono);
  }
  body.manual-mode .manual-nav{ display:flex; }
  .manual-nav .row{ display:flex; align-items:center; gap:16px; }
  .manual-nav .nav-btn{
    font-family:var(--mono); font-size:20px; line-height:1;
    background:#fff; color:var(--fg); border:1px solid var(--grid);
    border-radius:8px; width:40px; height:40px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 14px rgba(0,0,0,.08);
  }
  .manual-nav .nav-btn:hover{ border-color:var(--accent); color:var(--accent); }
  .manual-nav .counter{
    font-size:13px; color:var(--fg-dim); min-width:70px; text-align:center;
    background:#fff; border-radius:8px; padding:8px 12px; box-shadow:0 4px 14px rgba(0,0,0,.08);
  }
  .manual-nav .dots{ display:flex; gap:5px; flex-wrap:wrap; max-width:900px; justify-content:center; }
  .manual-nav .dot{ width:8px; height:8px; border-radius:50%; background:var(--grid); border:none; cursor:pointer; padding:0; }
  .manual-nav .dot.on{ background:var(--accent); }

  /* ---- speaker-text panel: manual-mode only, never shown in recording ---- */
  .speaker-panel{
    display:none; position:fixed; right:0; top:0; bottom:0; width:340px;
    background:rgba(255,255,255,.97); border-left:1px solid var(--grid);
    box-shadow:-8px 0 24px rgba(0,0,0,.06); z-index:60;
    padding:28px 24px; box-sizing:border-box; overflow-y:auto;
    font-family:var(--mono);
  }
  body.manual-mode .speaker-panel{ display:block; }
  body.manual-mode.hide-speaker-text .speaker-panel{ display:none; }
  .speaker-panel .label{
    font-size:12px; letter-spacing:.08em; color:var(--fg-dim); margin-bottom:14px;
  }
  .speaker-panel .body{ font-size:17px; line-height:1.55; color:var(--fg); white-space:pre-wrap; }
</style>

<div class="stage">
  <p class="eyebrow" id="eyebrow">LINKING MASTR AND PECD</p>
  <div class="glow" id="glow"></div>

  <div id="content"></div>

  <div class="manual-nav" id="manual-nav">
    <div class="dots" id="manual-dots"></div>
    <div class="row">
      <button class="nav-btn" id="manual-prev" aria-label="Previous scene">‹</button>
      <div class="counter" id="manual-counter">1 / 1</div>
      <button class="nav-btn" id="manual-next" aria-label="Next scene">›</button>
      <button class="nav-btn" id="manual-toggle-text" aria-label="Toggle speaker text" title="Toggle speaker text (T)">T</button>
    </div>
  </div>

  <div class="speaker-panel" id="speaker-panel">
    <div class="label">SPEAKER TEXT</div>
    <div class="body" id="speaker-panel-body"></div>
  </div>
</div>

<script src="../../assets/katex/katex.min.js"></script>
<script src="data/pecd-masks.js"></script>
<script src="data/nuts2-solar.js"></script>
<script src="deck-scenes.js"></script>
<script>
  // ---------- small inline icon set for checklist items ----------
  // Copied from ../weather-forecasting-renewables-part2/deck.html's set
  // as-is (unused icons are cheap to keep around for future scenes).
  const ICONS = {
    cpu: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="7" width="10" height="10" rx="1.5"/><rect x="10" y="10" width="4" height="4" rx=".5"/><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/></svg>`,
    bulb: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.6.45 1.1 1.2 1.1 2.2h5a2.6 2.6 0 0 1 1.1-2.2A6 6 0 0 0 12 3Z"/></svg>`,
    wrench: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2-2Z"/></svg>`,
    layers: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 3 8l9 5 9-5-9-5Z"/><path d="M3 13l9 5 9-5"/></svg>`,
    globe: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>`,
    lock: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>`,

    bolt: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h7l-1 8 11-14h-7l1-6Z"/></svg>`,

  // ---------- content-driven text slides ----------
  // Generic style library (statement / thesis / formula / cta / image /
  // checklist) only, for this first draft. No bespoke SVG diagrams yet --
  // add them the same way ../weather-forecasting-renewables-part2/deck.html
  // does (a dedicated CSS block + build/apply/setXStep function group next
  // to RENDERERS, wired into renderScene below).
  const RENDERERS = {
    "statement": (s) => `
      ${s.kicker ? `<div class="kicker">${s.kicker}</div>` : ""}
      <div class="statement">${s.lines.join("<br>")}</div>
    `,
    "thesis": (s) => `
      ${s.kicker ? `<div class="kicker">${s.kicker}</div>` : ""}
      ${s.lines.map((l, i) => `<div class="thesis-line ${i === 1 ? 'accent' : ''}">${l}</div>`).join("")}
    `,
    "formula": (s) => `
      ${s.kicker ? `<div class="kicker">${s.kicker}</div>` : ""}
      <div class="formula-card">${katex.renderToString(s.latex, { displayMode: true, throwOnError: false, trust: true })}${s.note ? `<div class="formula-note">${s.note}</div>` : ""}</div>
    `,
    "cta": (s) => `
      <div class="kicker">${s.kicker || "MORE ON THIS"}</div>
      <div class="cta-domain">${s.content}</div>
    `,
    "image": (s) => `
      ${s.kicker ? `<div class="kicker">${s.kicker}</div>` : ""}
      <div class="image-slide">
        <img src="${s.src}" alt="${s.alt || ""}">
        ${s.citation ? `<div class="citation">${s.citation}</div>` : ""}
      </div>
    `,
    "checklist": (s) => `
      ${s.kicker ? `<div class="kicker">${s.kicker}</div>` : ""}
      <div class="checklist" id="checklist-items">
        ${s.items.map((it, i) => {
          const icon = typeof it === "object" ? it.icon : null;
          const text = typeof it === "object" ? it.text : it;
          const dim = typeof it === "object" && it.dim;
          const badge = icon && ICONS[icon] ? ICONS[icon] : (i + 1);
          const active = i < (s.revealCount ?? s.items.length);
          return `<div class="item ${active ? 'active' : ''}${dim ? ' dim' : ''}"><div class="num${icon ? ' icon' : ''}">${badge}</div>${text}</div>`;
        }).join("")}
      </div>
    `,
  };

  const GLOW_COLOR = {
    "statement": "#1f6f8b", "thesis": "#d9822b", "formula": "#d9822b", "cta": "#1f6f8b",
    "checklist": "#1f6f8b", "formula-reveal": "#d9822b", "image": "#1f6f8b",
  };

  const contentEl = document.getElementById("content");
  const eyebrowEl = document.getElementById("eyebrow");
  const glowEl = document.getElementById("glow");

  let checklistKey = null;
  let formulaRevealKey = null;
  let cfCapacityKey = null;
  let municipalityNutsKey = null;
  let peonGridKey = null;
  let capacityGrowthKey = null;
  let nuts2ChoroplethKey = null;
  let gridPathKey = null;

  function hideAllViews() {
    contentEl.classList.remove("show");
    checklistKey = null;
    formulaRevealKey = null;
    cfCapacityKey = null;
    municipalityNutsKey = null;
    peonGridKey = null;
    capacityGrowthKey = null;
    nuts2ChoroplethKey = null;
    gridPathKey = null;
  }

  function showSlide(scene) {
    hideAllViews();
    eyebrowEl.style.opacity = 1;
    glowEl.style.background = GLOW_COLOR[scene.style] || "#35437a";
    contentEl.innerHTML = RENDERERS[scene.style](scene);
    void contentEl.offsetWidth; // force reflow so opacity:0 commits before re-adding "show"
    contentEl.classList.add("show");
  }

  window.goToSlide = function (styleAndData) { showSlide(styleAndData); };

  window.setChecklistStep = function (kicker, items, n) {
    const key = kicker + "|" + JSON.stringify(items);
    if (key !== checklistKey) {
      hideAllViews();
      eyebrowEl.style.opacity = 1;
      glowEl.style.background = GLOW_COLOR["checklist"];
      const hlItems = items.map((it) => typeof it === "object" ? { ...it, text: applyHighlights(it.text) } : applyHighlights(it));
      contentEl.innerHTML = RENDERERS["checklist"]({ kicker, items: hlItems, revealCount: n });
      void contentEl.offsetWidth;
      contentEl.classList.add("show");
      checklistKey = key;
    } else {
      document.querySelectorAll("#checklist-items .item").forEach((el, i) => {
        el.classList.toggle("active", i < n);
      });
    }
  };

  // ---------- formula-reveal: fixed top formula, examples fading in one at a
  // time below ----------
  let formulaRevealShown = 0;

  window.setFormulaRevealStep = function (kicker, latex, examples, note, n) {
    const key = kicker + "|" + latex;
    if (key !== formulaRevealKey) {
      hideAllViews();
      eyebrowEl.style.opacity = 1;
      glowEl.style.background = GLOW_COLOR["formula-reveal"];
      contentEl.innerHTML = `
        ${kicker ? `<div class="kicker">${kicker}</div>` : ""}
        <div class="formula-card formula-reveal-card">
          <div class="formula-reveal-top">${katex.renderToString(latex, { displayMode: true, throwOnError: false, trust: true })}</div>
          <div class="formula-reveal-examples" id="formula-reveal-examples"></div>
        </div>
      `;
      void contentEl.offsetWidth;
      contentEl.classList.add("show");
      formulaRevealKey = key;
      formulaRevealShown = 0;
    }

    const wrap = document.getElementById("formula-reveal-examples");

    // backward navigation (manual browse mode): drop anything past n
    if (n < formulaRevealShown) {
      while (wrap.children.length > n) wrap.removeChild(wrap.lastChild);
      formulaRevealShown = n;
    }

    while (formulaRevealShown < n) {
      const div = document.createElement("div");
      div.className = "formula-reveal-example reveal";
      div.innerHTML = katex.renderToString(examples[formulaRevealShown], { displayMode: true, throwOnError: false, trust: true });
      wrap.appendChild(div);
      void div.offsetWidth;
      div.classList.add("active");
      formulaRevealShown++;
    }

    const hasNote = !!wrap.querySelector(".formula-note");
    if (note && n >= examples.length && !hasNote) {
      const noteDiv = document.createElement("div");
      noteDiv.className = "formula-note reveal";
      noteDiv.textContent = note;
      wrap.appendChild(noteDiv);
      void noteDiv.offsetWidth;
      noteDiv.classList.add("active");
    } else if (note && n < examples.length && hasNote) {
      wrap.removeChild(wrap.querySelector(".formula-note"));
    }
  };

  // ---------- The goal: CF(t) curve × installed capacity → potential(t) ----------
  const CFC_STEPS = 3;
  const CFC_VALUES = [0.28, 0.52, 0.71, 0.60, 0.33, 0.18, 0.40, 0.66, 0.48]; // illustrative capacity factor, 0-1
  const CFC_CAPACITY_LABEL = "18 GW";
  const CFC_TOP_Y = 160, CFC_BASE_Y = 560;
  const CFC_LEFT_X0 = 120, CFC_LEFT_X1 = 560;
  const CFC_RIGHT_X0 = 900, CFC_RIGHT_X1 = 1400;
  const CFC_BAR_X = 660, CFC_BAR_W = 100;

  function cfcY(value) { return CFC_BASE_Y - value * (CFC_BASE_Y - CFC_TOP_Y); }
  function cfcPath(x0, x1) {
    return CFC_VALUES.map((v, i) => {
      const x = x0 + (x1 - x0) * i / (CFC_VALUES.length - 1);
      return `${i === 0 ? "M" : "L"}${x.toFixed(1)},${cfcY(v).toFixed(1)}`;
    }).join(" ");
  }

  function buildCfCapacitySVG(kicker) {
    return `
      ${kicker ? `<div class="kicker">${kicker}</div>` : ""}
      <svg width="1500" height="680" viewBox="0 0 1500 680">
        <line class="cfc-axis" data-step="1" x1="${CFC_LEFT_X0 - 20}" y1="${CFC_BASE_Y}" x2="${CFC_LEFT_X1 + 20}" y2="${CFC_BASE_Y}"/>
        <text class="cfc-tick-label" data-step="1" x="${CFC_LEFT_X0 - 20}" y="${CFC_TOP_Y - 10}">1.0</text>
        <text class="cfc-tick-label" data-step="1" x="${CFC_LEFT_X0 - 20}" y="${CFC_BASE_Y + 24}">0</text>
        <text class="cfc-panel-label" data-step="1" x="${CFC_LEFT_X0 - 20}" y="${CFC_TOP_Y - 40}">CAPACITY FACTOR — PECD</text>
        <text class="cfc-tick-label" data-step="1" x="${CFC_LEFT_X1 - 60}" y="${CFC_BASE_Y + 46}">TIME &#8594;</text>
        <path class="cfc-curve" data-step="1" d="${cfcPath(CFC_LEFT_X0, CFC_LEFT_X1)}"/>

        <text class="cfc-op" data-step="2" x="${(CFC_LEFT_X1 + CFC_BAR_X) / 2}" y="${(CFC_TOP_Y + CFC_BASE_Y) / 2 + 15}">&#215;</text>
        <rect class="cfc-cap-bar" data-step="2" x="${CFC_BAR_X}" y="${CFC_TOP_Y}" width="${CFC_BAR_W}" height="${CFC_BASE_Y - CFC_TOP_Y}" rx="6"/>
        <text class="cfc-cap-value" data-step="2" x="${CFC_BAR_X + CFC_BAR_W / 2}" y="${CFC_TOP_Y - 20}">${CFC_CAPACITY_LABEL}</text>
        <text class="cfc-cap-label" data-step="2" x="${CFC_BAR_X + CFC_BAR_W / 2}" y="${CFC_BASE_Y + 34}">INSTALLED CAPACITY</text>
        <text class="cfc-cap-label" data-step="2" x="${CFC_BAR_X + CFC_BAR_W / 2}" y="${CFC_BASE_Y + 56}">MASTR</text>

        <text class="cfc-op" data-step="3" x="${(CFC_BAR_X + CFC_BAR_W + CFC_RIGHT_X0) / 2}" y="${(CFC_TOP_Y + CFC_BASE_Y) / 2 + 15}">=</text>
        <line class="cfc-axis" data-step="3" x1="${CFC_RIGHT_X0 - 20}" y1="${CFC_BASE_Y}" x2="${CFC_RIGHT_X1 + 20}" y2="${CFC_BASE_Y}"/>
        <text class="cfc-tick-label" data-step="3" x="${CFC_RIGHT_X0 - 20}" y="${CFC_TOP_Y - 10}">${CFC_CAPACITY_LABEL}</text>
        <text class="cfc-tick-label" data-step="3" x="${CFC_RIGHT_X0 - 20}" y="${CFC_BASE_Y + 24}">0</text>
        <text class="cfc-panel-label" data-step="3" x="${CFC_RIGHT_X0 - 20}" y="${CFC_TOP_Y - 40}">POTENTIAL GENERATION — CF &#215; CAPACITY</text>
        <text class="cfc-tick-label" data-step="3" x="${CFC_RIGHT_X1 - 60}" y="${CFC_BASE_Y + 46}">TIME &#8594;</text>
        <path class="cfc-curve" data-step="3" d="${cfcPath(CFC_RIGHT_X0, CFC_RIGHT_X1)}"/>

        <text class="cfc-caption" data-step="3" x="750" y="640">potential(t) = CF(t) &#215; capacity</text>
      </svg>
    `;
  }

  window.setCfCapacityStep = function (kicker, n) {
    const key = kicker + "|cf-capacity";
    if (key !== cfCapacityKey) {
      hideAllViews();
      eyebrowEl.style.opacity = 1;
      glowEl.style.background = GLOW_COLOR["checklist"];
      contentEl.innerHTML = buildCfCapacitySVG(kicker);
      void contentEl.offsetWidth;
      contentEl.classList.add("show");
      cfCapacityKey = key;
    }
    contentEl.querySelectorAll("[data-step]").forEach((el) => {
      const s = Number(el.getAttribute("data-step"));
      el.classList.toggle("active", s <= n);
    });
  };

  // ---------- Municipality → NUTS3 → NUTS2 ----------
  // Real Germany outline, same source/coordinates as
  // ../weather-forecasting-renewables-part2/deck.html's fleet-map diagram
  // (Natural Earth 1:110m, extracted from the shared
  // ../../assets/geo/era5-grid-data.js).
  const DE_OUTLINE = [[14.12,53.76],[14.35,53.25],[14.07,52.98],[14.44,52.62],[14.69,52.09],[14.61,51.75],[15.02,51.11],[14.57,51],[14.31,51.12],[14.06,50.93],[13.34,50.73],[12.97,50.48],[12.24,50.27],[12.42,49.97],[12.52,49.55],[13.03,49.31],[13.6,48.88],[13.24,48.42],[12.88,48.29],[13.03,47.64],[12.93,47.47],[12.62,47.67],[12.14,47.7],[11.43,47.52],[10.54,47.57],[10.4,47.3],[9.9,47.58],[9.59,47.53],[8.52,47.83],[8.32,47.61],[7.47,47.62],[7.59,48.33],[8.1,49.02],[6.66,49.2],[6.19,49.46],[6.24,49.9],[6.04,50.13],[6.16,50.8],[5.99,51.85],[6.59,51.85],[6.84,52.23],[7.09,53.14],[6.91,53.48],[7.1,53.69],[7.94,53.75],[8.12,53.53],[8.8,54.02],[8.57,54.4],[8.53,54.96],[9.28,54.83],[9.92,54.98],[9.94,54.6],[10.95,54.36],[10.94,54.01],[11.96,54.2],[12.52,54.47],[13.65,54.08],[14.12,53.76]];
  const DE_LON_MIN = 5.99, DE_LON_MAX = 15.02, DE_LAT_MIN = 47.3, DE_LAT_MAX = 54.98;
  const DE_MAP_H = 560, DE_MAP_X0 = 150, DE_MAP_Y0 = 70;
  const DE_MAP_W = DE_MAP_H * ((DE_LON_MAX - DE_LON_MIN) * Math.cos((DE_LAT_MIN + DE_LAT_MAX) / 2 * Math.PI / 180)) / (DE_LAT_MAX - DE_LAT_MIN);

  function deProject(lon, lat) {
    return {
      x: DE_MAP_X0 + (lon - DE_LON_MIN) / (DE_LON_MAX - DE_LON_MIN) * DE_MAP_W,
      y: DE_MAP_Y0 + (DE_LAT_MAX - lat) / (DE_LAT_MAX - DE_LAT_MIN) * DE_MAP_H,
    };
  }

  // Real example: Stuttgart. municipality_key/nuts3_code pulled directly
  // from ~/research/mastr-power-capacities-germany's own LAU-NUTS
  // correspondence table (data/downloads/lau_nuts_correspondence.parquet,
  // row 0: "08111000" -> "DE111"); NUTS2 "DE11" is that code's first four
  // characters, per Eurostat's own nesting convention. NUTS3/NUTS2 shapes
  // drawn here are illustrative circles/ellipses at Stuttgart's real
  // coordinates -- not surveyed Stadtkreis/Regierungsbezirk boundaries.
  const MN_LON = 9.1829, MN_LAT = 48.7758;
  const MN_MUNI_KEY = "08111000", MN_NUTS3 = "DE111", MN_NUTS2 = "DE11";
  const MN_CAPTION = [
    `${MN_MUNI_KEY} — a municipality key (Stuttgart)`,
    `${MN_MUNI_KEY} → ${MN_NUTS3}, via Eurostat's LAU→NUTS3 correspondence table`,
    `${MN_NUTS3} → ${MN_NUTS2} — just the first four characters`,
  ];

  const MN_LABEL_X = 760, MN_LABEL_Y0 = 300, MN_LABEL_DY = 46;

  function buildMunicipalityNutsSVG(kicker) {
    const outlineD = DE_OUTLINE.map((p, i) => {
      const q = deProject(p[0], p[1]);
      return `${i === 0 ? "M" : "L"}${q.x.toFixed(1)},${q.y.toFixed(1)}`;
    }).join(" ") + " Z";
    const pt = deProject(MN_LON, MN_LAT);

    return `
      ${kicker ? `<div class="kicker">${kicker}</div>` : ""}
      <svg width="1500" height="740" viewBox="0 0 1500 740">
        <path class="mn-outline" d="${outlineD}"/>
        <line class="mn-leader" data-step="1" x1="${(pt.x + 8).toFixed(1)}" y1="${(pt.y - 6).toFixed(1)}" x2="${MN_LABEL_X - 24}" y2="${MN_LABEL_Y0 + 6}"/>
        <circle class="mn-point" data-step="1" cx="${pt.x.toFixed(1)}" cy="${pt.y.toFixed(1)}" r="7"/>
        <circle class="mn-nuts3-ring" data-step="2" cx="${pt.x.toFixed(1)}" cy="${pt.y.toFixed(1)}" r="16"/>
        <ellipse class="mn-nuts2-blob" data-step="3" cx="${(pt.x + 12).toFixed(1)}" cy="${(pt.y - 18).toFixed(1)}" rx="95" ry="74"/>

        <text class="mn-point-label" data-step="1" x="${MN_LABEL_X}" y="${MN_LABEL_Y0}">${MN_MUNI_KEY} · STUTTGART</text>
        <text class="mn-ring-label nuts3" data-step="2" x="${MN_LABEL_X}" y="${MN_LABEL_Y0 + MN_LABEL_DY}">NUTS3 · ${MN_NUTS3}</text>
        <text class="mn-ring-label nuts2" data-step="3" x="${MN_LABEL_X}" y="${MN_LABEL_Y0 + MN_LABEL_DY * 2}">NUTS2 · ${MN_NUTS2}</text>

        <text class="mn-caption" id="mn-caption" data-step="1" x="750" y="712">${MN_CAPTION[0]}</text>
      </svg>
    `;
  }

  window.setMunicipalityNutsStep = function (kicker, n) {
    const key = kicker + "|municipality-nuts";
    const idx = Math.max(0, Math.min(MN_CAPTION.length - 1, n - 1));
    if (key !== municipalityNutsKey) {
      hideAllViews();
      eyebrowEl.style.opacity = 1;
      glowEl.style.background = GLOW_COLOR["checklist"];
      contentEl.innerHTML = buildMunicipalityNutsSVG(kicker);
      void contentEl.offsetWidth;
      contentEl.classList.add("show");
      municipalityNutsKey = key;
    }
    const caption = document.getElementById("mn-caption");
    if (caption) caption.textContent = MN_CAPTION[idx];
    contentEl.querySelectorAll("[data-step]").forEach((el) => {
      const s = Number(el.getAttribute("data-step"));
      el.classList.toggle("active", s <= n);
    });
  };

  // ---------- PEON grid: the real PECD zone mask ----------
  // PECD_MASKS.peon loaded from data/pecd-masks.js -- vendored directly
  // from mastr-power-capacities-germany's data/processed/
  // pecd_region_mask_peon.parquet (843 cells, 7 zones, 145 of the cells
  // genuinely multi-zone -- everything else belongs to exactly one zone).
  // Each cell: [lat, lon, [[zoneId, weight], ...]] sorted by weight desc.
  const PEON_ZONES = ["DE01", "DE02", "DE03", "DE04", "DE05", "DE06", "DE07"];
  const PEON_ZONE_COLOR = {
    DE01: "#2a78d6", DE02: "#eb6834", DE03: "#1baf7a", DE04: "#eda100",
    DE05: "#e87ba4", DE06: "#008300", DE07: "#4a3aa7",
  };
  const PEON_CELL_DEG = 0.25;
  const PEON_CELL_W = PEON_CELL_DEG / (DE_LON_MAX - DE_LON_MIN) * DE_MAP_W;
  const PEON_CELL_H = PEON_CELL_DEG / (DE_LAT_MAX - DE_LAT_MIN) * DE_MAP_H;
  // Real example multi-zone cell (48.25N, 10.0E): DE06 0.6553 / DE07 0.3284
  // raw weight -- renormalized to Germany's own two zones at that cell,
  // per mastr-power-capacities-germany's documented method.
  const PEON_EXAMPLE = { lat: 48.25, lon: 10.0, zoneA: "DE06", wA: 0.666, zoneB: "DE07", wB: 0.334 };
  const PEON_PLANT_MW = 4.0;

  function peonZoneCentroids() {
    const sums = {};
    PECD_MASKS.peon.forEach(([lat, lon, zones]) => {
      const top = zones[0][0];
      if (!sums[top]) sums[top] = { x: 0, y: 0, n: 0 };
      sums[top].x += lon; sums[top].y += lat; sums[top].n += 1;
    });
    const out = {};
    for (const z of PEON_ZONES) {
      if (sums[z]) out[z] = { lon: sums[z].x / sums[z].n, lat: sums[z].y / sums[z].n };
    }
    return out;
  }

  function buildPeonGridSVG(kicker) {
    const outlineD = DE_OUTLINE.map((p, i) => {
      const q = deProject(p[0], p[1]);
      return `${i === 0 ? "M" : "L"}${q.x.toFixed(1)},${q.y.toFixed(1)}`;
    }).join(" ") + " Z";

    const cells = PECD_MASKS.peon.map(([lat, lon, zones]) => {
      const p = deProject(lon, lat);
      const color = PEON_ZONE_COLOR[zones[0][0]] || "#999";
      return `<rect class="pg-cell" data-step="1" x="${(p.x - PEON_CELL_W / 2).toFixed(1)}" y="${(p.y - PEON_CELL_H / 2).toFixed(1)}" width="${PEON_CELL_W.toFixed(1)}" height="${PEON_CELL_H.toFixed(1)}" fill="${color}"/>`;
    }).join("");

    const centroids = peonZoneCentroids();
    const zoneLabels = PEON_ZONES.map((z) => {
      if (!centroids[z]) return "";
      const p = deProject(centroids[z].lon, centroids[z].lat);
      return `<text class="pg-zone-label" data-step="1" x="${p.x.toFixed(1)}" y="${p.y.toFixed(1)}">${z}</text>`;
    }).join("");

    const legend = PEON_ZONES.map((z, i) => {
      const col = 150 + Math.floor(i / 4) * 300;
      const row = i % 4;
      const y = 668 + row * 24;
      return `
        <rect class="pg-legend" data-step="1" x="${col}" y="${y - 12}" width="14" height="14" rx="2" fill="${PEON_ZONE_COLOR[z]}"/>
        <text class="pg-legend pg-legend-label" data-step="1" x="${col + 22}" y="${y}">${z}</text>
      `;
    }).join("");

    const ex = deProject(PEON_EXAMPLE.lon, PEON_EXAMPLE.lat);
    const calloutX = 820, calloutY = 400;

    return `
      ${kicker ? `<div class="kicker">${kicker}</div>` : ""}
      <svg width="1500" height="740" viewBox="0 0 1500 740">
        ${cells}
        <path class="pg-outline" d="${outlineD}"/>
        ${zoneLabels}
        ${legend}

        <line class="pg-leader" data-step="2" x1="${(ex.x + 13).toFixed(1)}" y1="${(ex.y - 8).toFixed(1)}" x2="${calloutX - 16}" y2="${calloutY + 40}"/>
        <circle class="pg-example-ring" data-step="2" cx="${ex.x.toFixed(1)}" cy="${ex.y.toFixed(1)}" r="18"/>
        <g class="pg-callout" data-step="2" transform="translate(${calloutX},${calloutY})">
          <rect x="0" y="0" width="360" height="118" rx="10"/>
          <text class="pg-callout-title" x="16" y="28">ONE REAL GRID CELL (48.25N, 10.0E)</text>
          <text class="pg-callout-line" x="16" y="56">${PEON_EXAMPLE.zoneA} — ${(PEON_EXAMPLE.wA * 100).toFixed(0)}% of this cell</text>
          <text class="pg-callout-line" x="16" y="80">${PEON_EXAMPLE.zoneB} — ${(PEON_EXAMPLE.wB * 100).toFixed(0)}% of this cell</text>
          <text class="pg-callout-line" id="pg-callout-plant" x="16" y="104"></text>
        </g>
        <circle class="pg-plant" data-step="3" cx="${ex.x.toFixed(1)}" cy="${ex.y.toFixed(1)}" r="6"/>
      </svg>
    `;
  }

  window.setPeonGridStep = function (kicker, n) {
    const key = kicker + "|peon-grid";
    if (key !== peonGridKey) {
      hideAllViews();
      eyebrowEl.style.opacity = 1;
      glowEl.style.background = GLOW_COLOR["checklist"];
      contentEl.innerHTML = buildPeonGridSVG(kicker);
      void contentEl.offsetWidth;
      contentEl.classList.add("show");

    }
    const plantLine = document.getElementById("pg-callout-plant");
    if (plantLine) {
      plantLine.textContent = n >= 3
        ? `a ${PEON_PLANT_MW.toFixed(1)} MW plant here → ${(PEON_PLANT_MW * PEON_EXAMPLE.wA).toFixed(1)} + ${(PEON_PLANT_MW * PEON_EXAMPLE.wB).toFixed(1)} MW`
        : "";

    contentEl.querySelectorAll("[data-step]").forEach((el) => {
      const s = Number(el.getAttribute("data-step"));

  // ---------- PEOF grid: the real PECD offshore zone mask ----------
  // PECD_MASKS.peof loaded from data/pecd-masks.js -- vendored from
  // mastr-power-capacities-germany's data/processed/
  // pecd_region_mask_peof.parquet (202 cells, 6 zones: DE011_OFF..
  // DE015_OFF in the North Sea, DE02_OFF in the Baltic). Own projection
  // (not deProject) since this extent sits further north/west than the
  // onshore map -- North Sea + Baltic, not the German landmass itself.
  const PEOF_ZONES = ["DE011_OFF", "DE012_OFF", "DE013_OFF", "DE014_OFF", "DE015_OFF", "DE02_OFF"];
  const PEOF_ZONE_COLOR = {
    DE011_OFF: "#2a78d6", DE012_OFF: "#eb6834", DE013_OFF: "#1baf7a",
    DE014_OFF: "#eda100", DE015_OFF: "#e87ba4", DE02_OFF: "#4a3aa7",
  };
  const PEOF_LON_MIN = 3.5, PEOF_LON_MAX = 15.25, PEOF_LAT_MIN = 52.8, PEOF_LAT_MAX = 56.25;
  const PEOF_MAP_H = 460, PEOF_MAP_X0 = 295, PEOF_MAP_Y0 = 160;
  const PEOF_MAP_W = PEOF_MAP_H * ((PEOF_LON_MAX - PEOF_LON_MIN) * Math.cos((PEOF_LAT_MIN + PEOF_LAT_MAX) / 2 * Math.PI / 180)) / (PEOF_LAT_MAX - PEOF_LAT_MIN);
  const PEOF_CELL_DEG = 0.25;
  const PEOF_CELL_W = PEOF_CELL_DEG / (PEOF_LON_MAX - PEOF_LON_MIN) * PEOF_MAP_W;
  const PEOF_CELL_H = PEOF_CELL_DEG / (PEOF_LAT_MAX - PEOF_LAT_MIN) * PEOF_MAP_H;

  function peofProject(lon, lat) {
    return {
      x: PEOF_MAP_X0 + (lon - PEOF_LON_MIN) / (PEOF_LON_MAX - PEOF_LON_MIN) * PEOF_MAP_W,
      y: PEOF_MAP_Y0 + (PEOF_LAT_MAX - lat) / (PEOF_LAT_MAX - PEOF_LAT_MIN) * PEOF_MAP_H,
    };
  }

  function peofZoneCentroids() {
    const sums = {};
    PECD_MASKS.peof.forEach(([lat, lon, zones]) => {
      const top = zones[0][0];
      if (!sums[top]) sums[top] = { x: 0, y: 0, n: 0 };
      sums[top].x += lon; sums[top].y += lat; sums[top].n += 1;
    });
    const out = {};
    for (const z of PEOF_ZONES) {
      if (sums[z]) out[z] = { lon: sums[z].x / sums[z].n, lat: sums[z].y / sums[z].n };
    }
    return out;
  }

  function buildPeofGridSVG(kicker) {
    const outlineD = DE_OUTLINE.map((p, i) => {
      const q = peofProject(p[0], p[1]);
      return `${i === 0 ? "M" : "L"}${q.x.toFixed(1)},${q.y.toFixed(1)}`;
    }).join(" ") + " Z";

    const cells = PECD_MASKS.peof.map(([lat, lon, zones]) => {
      const p = peofProject(lon, lat);
      const color = PEOF_ZONE_COLOR[zones[0][0]] || "#999";
      return `<rect class="pf-cell" x="${(p.x - PEOF_CELL_W / 2).toFixed(1)}" y="${(p.y - PEOF_CELL_H / 2).toFixed(1)}" width="${PEOF_CELL_W.toFixed(1)}" height="${PEOF_CELL_H.toFixed(1)}" fill="${color}"/>`;
    }).join("");

    const centroids = peofZoneCentroids();
    const zoneLabels = PEOF_ZONES.map((z) => {
      if (!centroids[z]) return "";
      const p = peofProject(centroids[z].lon, centroids[z].lat);
      return `<text class="pf-zone-label" x="${p.x.toFixed(1)}" y="${p.y.toFixed(1)}">${z}</text>`;
    }).join("");

    const legendY = PEOF_MAP_Y0 + PEOF_MAP_H + 45;
    const legend = PEOF_ZONES.map((z, i) => {
      const col = 250 + i * 175;
      return `
        <rect x="${col}" y="${legendY - 12}" width="14" height="14" rx="2" fill="${PEOF_ZONE_COLOR[z]}"/>
        <text class="pf-legend-label" x="${col + 22}" y="${legendY}">${z}</text>
      `;
    }).join("");

    return `
      ${kicker ? `<div class="kicker">${kicker}</div>` : ""}
      <svg width="1500" height="680" viewBox="0 0 1500 680">
        ${cells}
        <path class="pf-outline" d="${outlineD}"/>
        ${zoneLabels}
        ${legend}
      </svg>
    `;
  }

  window.setPeofGridStep = function (kicker) {
    hideAllViews();
    eyebrowEl.style.opacity = 1;
    glowEl.style.background = GLOW_COLOR["checklist"];
    contentEl.innerHTML = buildPeofGridSVG(kicker);
    void contentEl.offsetWidth;
    contentEl.classList.add("show");
  };

  // ---------- One grid cell, several technologies ----------
  // Real PECD v4.2 wind-offshore capacity factors, DE011_OFF cell,
  // 6-hourly from 2020-01-01 00:00 to 2020-01-08 12:00 (31 points), one
  // series per technology (20/21/22) -- downloaded from the CDS API for
  // this deck specifically, since neither source repo ever pulls more
  // than one wind technology. Same weather throughout; only the
  // technology assumption changes the curve.
  const PT_STEPS = 3;
  const PT_LABELS = ["EXISTING (TECH 20)", "SP316 HH155 (TECH 21)", "SP370 HH155 (TECH 22)"];
  const PT_COLORS = ["#1f6f8b", "#d9822b", "#4a3aa7"];
  const PT_SERIES = [
    [0.020,0.153,0.258,0.426,0.352,0.637,0.730,0.891,0.890,0.889,0.284,0.718,0.875,0.875,0.833,0.609,0.098,0.344,0.699,0.658,0.700,0.657,0.717,0.754,0.740,0.637,0.707,0.886,0.890,0.867,0.530],
    [0.035,0.246,0.408,0.637,0.543,0.841,0.902,0.950,0.945,0.940,0.361,0.907,0.945,0.940,0.936,0.818,0.160,0.520,0.896,0.875,0.894,0.868,0.899,0.913,0.905,0.860,0.899,0.945,0.945,0.945,0.784],
    [0.028,0.210,0.352,0.573,0.476,0.799,0.877,0.950,0.945,0.940,0.310,0.886,0.945,0.940,0.934,0.782,0.136,0.458,0.876,0.848,0.872,0.840,0.881,0.898,0.889,0.828,0.878,0.945,0.945,0.945,0.737],
  ];
  const PT_X0 = 220, PT_X1 = 1440, PT_TOP_Y = 180, PT_BASE_Y = 560;

  function ptX(i) { return PT_X0 + (PT_X1 - PT_X0) * i / (PT_SERIES[0].length - 1); }
  function ptY(v) { return PT_BASE_Y - v * (PT_BASE_Y - PT_TOP_Y); }
  function ptPath(series) { return series.map((v, i) => `${i === 0 ? "M" : "L"}${ptX(i).toFixed(1)},${ptY(v).toFixed(1)}`).join(" "); }

  function buildPeofTechSeriesSVG(kicker) {
    const yTicks = [0, 0.5, 1].map((v) => `
      <line class="pt-axis" x1="${PT_X0}" y1="${ptY(v).toFixed(1)}" x2="${PT_X1}" y2="${ptY(v).toFixed(1)}" opacity=".3"/>
      <text class="pt-tick-label" x="${PT_X0 - 14}" y="${(ptY(v) + 5).toFixed(1)}" text-anchor="end">${v.toFixed(1)}</text>
    `).join("");

    const curves = PT_SERIES.map((series, i) =>
      `<path class="pt-curve" data-step="${i + 1}" d="${ptPath(series)}" stroke="${PT_COLORS[i]}"/>`
    ).join("");

    const legend = PT_LABELS.map((label, i) => `
      <g class="pt-legend" data-step="${i + 1}" transform="translate(${PT_X0 + i * 400},110)">
        <rect width="16" height="16" rx="3" fill="${PT_COLORS[i]}"/>
        <text class="pt-legend-label" x="24" y="13" fill="${PT_COLORS[i]}">${label}</text>
      </g>
    `).join("");

    return `
      ${kicker ? `<div class="kicker">${kicker}</div>` : ""}
      <svg width="1500" height="680" viewBox="0 0 1500 680">
        <text class="pt-tick-label" x="${PT_X0}" y="70">ONE GRID CELL — DE011_OFF, NORTH SEA, JAN 2020</text>
        ${legend}
        ${yTicks}
        <line class="pt-axis" x1="${PT_X0}" y1="${PT_BASE_Y}" x2="${PT_X1}" y2="${PT_BASE_Y}"/>
        ${curves}
        <text class="pt-tick-label" x="${PT_X1 - 60}" y="${PT_BASE_Y + 34}">TIME →</text>
        <text class="pt-caption" id="pt-caption" data-step="1" x="750" y="630">Same weather, same cell — a different capacity factor for every technology assumption.</text>
      </svg>
    `;
  }

  window.setPeofTechSeriesStep = function (kicker, n) {
    hideAllViews();
    eyebrowEl.style.opacity = 1;
    glowEl.style.background = GLOW_COLOR["checklist"];
    contentEl.innerHTML = buildPeofTechSeriesSVG(kicker);

    contentEl.classList.add("show");
    contentEl.querySelectorAll("[data-step]").forEach((el) => {
      const s = Number(el.getAttribute("data-step"));
      el.classList.toggle("active", s <= n);

  // ---------- Capacity growth: real annual wind+solar installed capacity ----------
  // [year, wind_mw, solar_mw], live capacity as of Dec 31 each year --
  // computed directly from mastr-power-capacities-germany's
  // data/processed/capacity_events.parquet (commissioning_date <= snapshot
  // AND (final_shutdown_date is null OR > snapshot), summed per technology).
  const CG_DATA = [[1990,7,6],[1991,14,7],[1992,30,8],[1993,75,10],[1994,185,11],[1995,439,13],[1996,655,16],[1997,931,22],[1998,1352,27],[1999,2311,36],[2000,3544,71],[2001,5964,162],[2002,8851,260],[2003,11449,387],[2004,13398,965],[2005,15144,1788],[2006,17340,2548],[2007,18987,3680],[2008,19753,5474],[2009,22469,9554],[2010,23928,16556],[2011,25903,23920],[2012,28395,30264],[2013,31632,33120],[2014,36767,34715],[2015,42878,35989],[2016,48134,37313],[2017,54911,38799],[2018,58346,41418],[2019,60339,44989],[2020,61743,49546],[2021,63380,54559],[2022,65795,61207],[2023,69034,74749],[2024,72334,89854],[2025,77451,104703],[2026,80613,111491]];
  const CG_X0 = 220, CG_X1 = 1440, CG_TOP_Y = 140, CG_BASE_Y = 600;
  const CG_Y_MAX = 200000; // GW ticks at 0/50/100/150/200

  function cgX(i) { return CG_X0 + (CG_X1 - CG_X0) * i / (CG_DATA.length - 1); }
  function cgY(mw) { return CG_BASE_Y - Math.min(mw, CG_Y_MAX) / CG_Y_MAX * (CG_BASE_Y - CG_TOP_Y); }

  function buildCapacityGrowthSVG(kicker) {
    const windTop = CG_DATA.map((d, i) => `${i === 0 ? "M" : "L"}${cgX(i).toFixed(1)},${cgY(d[1]).toFixed(1)}`).join(" ");
    const windBase = [...CG_DATA].reverse().map((d, i) => `L${cgX(CG_DATA.length - 1 - i).toFixed(1)},${CG_BASE_Y}`).join(" ");
    const windPath = `${windTop} ${windBase} Z`;

    const solarTop = CG_DATA.map((d, i) => `${i === 0 ? "M" : "L"}${cgX(i).toFixed(1)},${cgY(d[1] + d[2]).toFixed(1)}`).join(" ");
    const solarBase = [...CG_DATA].reverse().map((d, i) => `L${cgX(CG_DATA.length - 1 - i).toFixed(1)},${cgY(CG_DATA[CG_DATA.length - 1 - i][1]).toFixed(1)}`).join(" ");
    const solarPath = `${solarTop} ${solarBase} Z`;

    const yTicks = [0, 50000, 100000, 150000, 200000].map((v) => `
      <line class="cg-gridline" x1="${CG_X0}" y1="${cgY(v).toFixed(1)}" x2="${CG_X1}" y2="${cgY(v).toFixed(1)}"/>
      <text class="cg-tick-label" x="${CG_X0 - 14}" y="${(cgY(v) + 5).toFixed(1)}" text-anchor="end">${v / 1000} GW</text>
    `).join("");

    const xTicks = CG_DATA.filter((d) => d[0] % 5 === 0).map((d) => {
      const i = CG_DATA.indexOf(d);
      return `<text class="cg-tick-label" x="${cgX(i).toFixed(1)}" y="${CG_BASE_Y + 28}" text-anchor="middle">${d[0]}</text>`;
    }).join("");

    return `
      ${kicker ? `<div class="kicker">${kicker}</div>` : ""}
      <svg width="1500" height="680" viewBox="0 0 1500 680">
        ${yTicks}
        <line class="cg-axis" x1="${CG_X0}" y1="${CG_BASE_Y}" x2="${CG_X1}" y2="${CG_BASE_Y}"/>
        <path class="cg-area cg-area-wind" data-step="1" d="${windPath}"/>
        <path class="cg-area cg-area-solar" data-step="2" d="${solarPath}"/>
        ${xTicks}

        <rect class="cg-legend" data-step="1" x="${CG_X0}" y="70" width="14" height="14" rx="2" fill="var(--accent)"/>
        <text class="cg-legend cg-legend-label" data-step="1" x="${CG_X0 + 22}" y="82">WIND</text>
        <rect class="cg-legend" data-step="2" x="${CG_X0 + 110}" y="70" width="14" height="14" rx="2" fill="var(--accent-warm)"/>
        <text class="cg-legend cg-legend-label" data-step="2" x="${CG_X0 + 132}" y="82">SOLAR</text>

        <text class="cg-caption" data-step="2" x="830" y="660">Germany's installed wind + solar capacity, 1990–2026 — from MaStR, summed live plant by plant.</text>
      </svg>
    `;
  }

  window.setCapacityGrowthStep = function (kicker, n) {
    const key = kicker + "|capacity-growth";
    if (key !== capacityGrowthKey) {
      hideAllViews();
      eyebrowEl.style.opacity = 1;
      glowEl.style.background = GLOW_COLOR["checklist"];
      contentEl.innerHTML = buildCapacityGrowthSVG(kicker);
      void contentEl.offsetWidth;
      contentEl.classList.add("show");
      capacityGrowthKey = key;
    }
    contentEl.querySelectorAll("[data-step]").forEach((el) => {
      const s = Number(el.getAttribute("data-step"));
      el.classList.toggle("active", s <= n);
    });
  };

  // ---------- NUTS2 choropleth: real solar capacity by region ----------
  // NUTS2_SOLAR loaded from data/nuts2-solar.js: [[nuts2Id, capacityMw,
  // [[[lon,lat],...], ...polygons]], ...], 38 German NUTS2 regions --
  // the resolution PECD's own solar capacity-factor product ships at.
  const N2_MIN = Math.min(...NUTS2_SOLAR.map((d) => d[1]));
  const N2_MAX = Math.max(...NUTS2_SOLAR.map((d) => d[1]));

  function n2Color(mw) {
    const t = Math.max(0, Math.min(1, (mw - N2_MIN) / (N2_MAX - N2_MIN)));
    const lightness = 90 - t * 62; // 90% (lightest) -> 28% (darkest), fixed warm hue
    return `hsl(30, 70%, ${lightness.toFixed(0)}%)`;
  }

  function buildNuts2ChoroplethSVG(kicker) {
    const outlineD = DE_OUTLINE.map((p, i) => {
      const q = deProject(p[0], p[1]);
      return `${i === 0 ? "M" : "L"}${q.x.toFixed(1)},${q.y.toFixed(1)}`;
    }).join(" ") + " Z";

    const regions = NUTS2_SOLAR.map(([id, mw, polys]) => {
      const d = polys.map((ring) =>
        ring.map((p, i) => {
          const q = deProject(p[0], p[1]);
          return `${i === 0 ? "M" : "L"}${q.x.toFixed(1)},${q.y.toFixed(1)}`;
        }).join(" ") + " Z"
      ).join(" ");
      return `<path class="n2-region" data-step="1" d="${d}" fill="${n2Color(mw)}"/>`;
    }).join("");

    const legendX0 = 1180, legendY = 200, legendW = 26, legendH = 160;
    const legendStops = 6;
    const legendRects = Array.from({ length: legendStops }, (_, i) => {
      const t = i / (legendStops - 1);
      const mw = N2_MIN + t * (N2_MAX - N2_MIN);
      const y = legendY + legendH - (i + 1) * (legendH / legendStops);
      return `<rect class="n2-region" data-step="1" x="${legendX0}" y="${y.toFixed(1)}" width="${legendW}" height="${(legendH / legendStops).toFixed(1)}" fill="${n2Color(mw)}"/>`;
    }).join("");

    return `
      ${kicker ? `<div class="kicker">${kicker}</div>` : ""}
      <svg width="1500" height="680" viewBox="0 0 1500 680">
        ${regions}
        <path class="n2-outline" d="${outlineD}"/>

        ${legendRects}
        <text class="n2-legend-label" data-step="1" x="${legendX0 + legendW + 10}" y="${legendY + 14}">${(N2_MAX / 1000).toFixed(1)} GW</text>
        <text class="n2-legend-label" data-step="1" x="${legendX0 + legendW + 10}" y="${legendY + legendH}">${(N2_MIN).toFixed(0)} MW</text>
        <text class="n2-legend-label" data-step="1" x="${legendX0}" y="${legendY - 14}">SOLAR CAPACITY</text>

        <text class="n2-caption" id="n2-caption" data-step="1" x="750" y="650"></text>
      </svg>
    `;
  }

  const N2_CAPTION = [
    "38 NUTS2 regions — the actual resolution PECD's solar data ships at.",
    "183 MW to 8,475 MW per region — Bremen, a city-state, lowest; rural Brandenburg highest.",
  ];

  window.setNuts2ChoroplethStep = function (kicker, n) {
    const key = kicker + "|nuts2-choropleth";
    const idx = Math.max(0, Math.min(N2_CAPTION.length - 1, n - 1));
    if (key !== nuts2ChoroplethKey) {
      hideAllViews();
      eyebrowEl.style.opacity = 1;
      glowEl.style.background = GLOW_COLOR["checklist"];
      contentEl.innerHTML = buildNuts2ChoroplethSVG(kicker);
      void contentEl.offsetWidth;
      contentEl.classList.add("show");
      nuts2ChoroplethKey = key;
    }
    const caption = document.getElementById("n2-caption");
    if (caption) caption.textContent = N2_CAPTION[idx];
    contentEl.querySelectorAll("[data-step]").forEach((el) => {
      const s = Number(el.getAttribute("data-step"));
      el.classList.toggle("active", s <= n);
    });
  };

  // ---------- Going more granular: schematic grid, two paths ----------
  // Purely illustrative geometry (not real PECD grid data -- that
  // product is never downloaded in any project this deck draws on).
  // Three mutually-exclusive scenarios on the same small grid: wind's
  // direct point-in-cell placement, and solar's two options (area-weight
  // a region, or a municipality centroid point). Non-monotonic reveal
  // (each step replaces the last, not cumulative) -- same idiom as
  // fleetSnapshotApplyState in ../weather-forecasting-renewables-part2.
  const GP_COLS = 6, GP_ROWS = 5, GP_CELL = 72;
  const GP_X0 = 534, GP_Y0 = 170;
  const GP_PANEL_LABEL = [
    "WIND — EXACT COORDINATE, EXACT CELL",
    "PV, OPTION A — AREA-WEIGHT A REGION ACROSS CELLS",
    "PV, OPTION B — MUNICIPALITY CENTROID, ONE CELL",
  ];
  const GP_CAPTION = [
    "A plant's (lon, lat) falls in exactly one cell — no fractional split needed.",
    "Full cells count 100%; boundary cells count only their overlap share.",
    "No area math at all — just one more point, placed the same way as wind.",
  ];

  function gpCellRect(row, col) {
    return { x: GP_X0 + col * GP_CELL, y: GP_Y0 + row * GP_CELL };
  }
  function gpCellCenter(row, col) {
    const r = gpCellRect(row, col);
    return { x: r.x + GP_CELL / 2, y: r.y + GP_CELL / 2 };
  }

  function buildGridPathSVG(kicker) {
    const cells = [];
    for (let r = 0; r < GP_ROWS; r++) {
      for (let c = 0; c < GP_COLS; c++) {
        const p = gpCellRect(r, c);
        cells.push(`<rect class="gp-cell" x="${p.x}" y="${p.y}" width="${GP_CELL}" height="${GP_CELL}"/>`);
      }
    }

    // Wind layer: one cell, fully inside, plus its plant point.
    const windCell = gpCellRect(2, 2), windCenter = gpCellCenter(2, 2);
    const windLayer = `
      <g class="gp-layer" id="gp-layer-0">
        <rect class="gp-cell-fill gp-cell-full" x="${windCell.x}" y="${windCell.y}" width="${GP_CELL}" height="${GP_CELL}"/>
        <g class="gp-point"><circle cx="${windCenter.x}" cy="${windCenter.y}" r="7"/></g>
        <text class="gp-point-label" x="${windCenter.x.toFixed(1)}" y="${(windCell.y + GP_CELL + 30).toFixed(1)}" text-anchor="middle">1 plant, 1 cell</text>
      </g>
    `;

    // PV area-weight layer: a small irregular cluster, full + partial cells.
    const PV_FULL = [[1, 2], [1, 3], [2, 3]];
    const PV_PARTIAL = [
      { row: 2, col: 2, w: "55%" }, { row: 1, col: 1, w: "30%" },
      { row: 2, col: 4, w: "40%" }, { row: 3, col: 3, w: "65%" }, { row: 3, col: 2, w: "20%" },
    ];
    const pvFullRects = PV_FULL.map(([r, c]) => {
      const p = gpCellRect(r, c);
      return `<rect class="gp-cell-fill gp-cell-full" x="${p.x}" y="${p.y}" width="${GP_CELL}" height="${GP_CELL}"/>`;
    }).join("");
    const pvPartialRects = PV_PARTIAL.map(({ row, col, w }) => {
      const p = gpCellRect(row, col);
      const center = gpCellCenter(row, col);
      return `
        <rect class="gp-cell-fill gp-cell-partial" x="${p.x}" y="${p.y}" width="${GP_CELL}" height="${GP_CELL}" style="fill-opacity:.22"/>
        <text class="gp-weight-label" x="${center.x.toFixed(1)}" y="${(center.y + 5).toFixed(1)}">${w}</text>
      `;
    }).join("");
    const pvAreaLayer = `<g class="gp-layer" id="gp-layer-1">${pvFullRects}${pvPartialRects}</g>`;

    // PV centroid layer: one cell (different spot), municipality-centroid point.
    const centCell = gpCellRect(3, 4), centCenter = gpCellCenter(3, 4);
    const centroidLayer = `
      <g class="gp-layer" id="gp-layer-2">
        <rect class="gp-cell-fill gp-cell-full" x="${centCell.x}" y="${centCell.y}" width="${GP_CELL}" height="${GP_CELL}"/>
        <g class="gp-point"><circle cx="${centCenter.x}" cy="${centCenter.y}" r="7"/></g>
        <text class="gp-point-label" x="${centCenter.x.toFixed(1)}" y="${(centCell.y + GP_CELL + 30).toFixed(1)}" text-anchor="middle">1 centroid, 1 cell</text>
      </g>
    `;

    return `
      ${kicker ? `<div class="kicker">${kicker}</div>` : ""}
      <svg width="1500" height="680" viewBox="0 0 1500 680">
        <text class="gp-panel-label" id="gp-panel-label" x="750" y="120" text-anchor="middle"></text>
        ${cells.join("")}
        ${windLayer}
        ${pvAreaLayer}
        ${centroidLayer}
        <text class="gp-caption" id="gp-caption" x="750" y="600" text-anchor="middle"></text>
      </svg>
    `;
  }

  function gridPathApplyState(idx) {
    for (let i = 0; i < 3; i++) {
      const layer = document.getElementById(`gp-layer-${i}`);
      if (!layer) continue;
      const on = i === idx;
      layer.querySelectorAll(".gp-cell-fill, .gp-point, .gp-point-label, .gp-weight-label").forEach((el) => {
        el.classList.toggle("active", on);
      });
    }
    const panelLabel = document.getElementById("gp-panel-label");
    if (panelLabel) { panelLabel.textContent = GP_PANEL_LABEL[idx]; panelLabel.classList.add("active"); }
    const caption = document.getElementById("gp-caption");
    if (caption) { caption.textContent = GP_CAPTION[idx]; caption.classList.add("active"); }
  }

  window.setGridPathStep = function (kicker, n) {
    const key = kicker + "|grid-path";
    const idx = Math.max(0, Math.min(2, n - 1));
    if (key !== gridPathKey) {
      hideAllViews();
      eyebrowEl.style.opacity = 1;
      glowEl.style.background = GLOW_COLOR["checklist"];
      contentEl.innerHTML = buildGridPathSVG(kicker);
      void contentEl.offsetWidth;
      contentEl.classList.add("show");
      gridPathKey = key;
    }
    gridPathApplyState(idx);
  };

  // Inline word-highlight markup: `[[word]]` in a scene's content/items text
  // becomes a styled <span>, e.g. "you can just [[call]]." -- lets a single
  // sentence flag which word to emphasize without a separate per-word field.
  function applyHighlights(text) {
    return text.replace(/\[\[(.+?)\]\]/g, '<span class="word-hl">$1</span>');
  }

  // ---------- generic scene renderer ----------
  // Single entry point the framework driver (and manual-browse mode) calls with
  // one storyline scene's `visual` object. Keeps the driver decoupled from this
  // deck's specific function/group names.
  function slideDataFromVisual(visual) {
    const data = { style: visual.style };
    if (visual.style === "formula") {
      data.latex = visual.latex || "";
      if (visual.note) data.note = visual.note;
    } else if (visual.style === "cta") {
      data.content = applyHighlights(visual.content || "");
    } else if (visual.style === "image") {
      data.src = visual.src || "";
      data.citation = visual.citation || "";
      data.alt = visual.alt || "";
    } else {
      const content = applyHighlights(visual.content || "");
      data.lines = content ? content.split("\n") : [];
    }
    if (visual.kicker) data.kicker = visual.kicker;
    return data;
  }

  window.renderScene = function (visual) {
    if (visual.kind === "text_slide") {
      window.goToSlide(slideDataFromVisual(visual));
    } else if (visual.kind === "checklist_step") {
      window.setChecklistStep(visual.kicker, visual.items, visual.step);
    } else if (visual.kind === "formula_reveal_step") {
      window.setFormulaRevealStep(visual.kicker, visual.latex, visual.examples, visual.note, visual.step);
    } else if (visual.kind === "cf_capacity_step") {
      window.setCfCapacityStep(visual.kicker, visual.step);
    } else if (visual.kind === "municipality_nuts_step") {
      window.setMunicipalityNutsStep(visual.kicker, visual.step);
    } else if (visual.kind === "peon_grid_step") {
      window.setPeonGridStep(visual.kicker, visual.step);
    } else if (visual.kind === "peof_grid_step") {
      window.setPeofGridStep(visual.kicker);
    } else if (visual.kind === "peof_tech_series_step") {
      window.setPeofTechSeriesStep(visual.kicker, visual.step);
    } else if (visual.kind === "capacity_growth_step") {
      window.setCapacityGrowthStep(visual.kicker, visual.step);
    } else if (visual.kind === "nuts2_choropleth_step") {
      window.setNuts2ChoroplethStep(visual.kicker, visual.step);
    } else if (visual.kind === "grid_path_step") {
      window.setGridPathStep(visual.kicker, visual.step);
    } else {
      throw new Error("Unknown visual.kind: " + visual.kind);
    }
  };

  // ---------- manual browsing mode (default view; recorder opts out via ?record=1) ----------
  if (!new URLSearchParams(location.search).has("record") && typeof DECK_SCENES !== "undefined") {
    document.body.classList.add("manual-mode");

    // the stage is a fixed 1920x1080 canvas; scale-to-fit + center it in the
    // actual browser window instead of letting it get silently clipped.
    const stageEl = document.querySelector(".stage");
    function fitStage() {
      const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
      stageEl.style.transform = `translate(-50%, -50%) scale(${scale})`;
    }
    fitStage();
    window.addEventListener("resize", fitStage);

    let idx = 0;
    const dotsWrap = document.getElementById("manual-dots");
    const counterEl = document.getElementById("manual-counter");

    DECK_SCENES.forEach((entry, i) => {
      const dot = document.createElement("button");
      dot.className = "dot";
      dot.title = `scene ${entry.id}`;
      dot.addEventListener("click", () => { idx = i; render(); });
      dotsWrap.appendChild(dot);
    });
    const dotEls = dotsWrap.querySelectorAll(".dot");

    const speakerPanelBody = document.getElementById("speaker-panel-body");

    function render() {
      window.renderScene(DECK_SCENES[idx].visual);
      counterEl.textContent = `${idx + 1} / ${DECK_SCENES.length}`;
      dotEls.forEach((d, i) => d.classList.toggle("on", i === idx));
      speakerPanelBody.textContent = DECK_SCENES[idx].text || "(no narration text)";
    }

    document.getElementById("manual-next").addEventListener("click", () => {
      idx = (idx + 1) % DECK_SCENES.length; render();
    });
    document.getElementById("manual-prev").addEventListener("click", () => {
      idx = (idx - 1 + DECK_SCENES.length) % DECK_SCENES.length; render();
    });
    document.getElementById("manual-toggle-text").addEventListener("click", () => {
      document.body.classList.toggle("hide-speaker-text");
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight") document.getElementById("manual-next").click();
      if (e.key === "ArrowLeft") document.getElementById("manual-prev").click();
      if (e.key.toLowerCase() === "t") document.getElementById("manual-toggle-text").click();
    });

    render();
  }
</script>
